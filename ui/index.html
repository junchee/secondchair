<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anne</title>
<link rel="icon" type="image/png" href="/anne.png">
<style>
  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --surface-me: #eef4ff;
    --border: #e4e4e0;
    --text: #1d1d1b;
    --muted: #74746f;
    --faint: #a5a5a0;
    --accent: #2f6fde;
    --korean: #8a6200;  /* the translation: amber, dark enough to read on a light page */
    --on-accent: #ffffff;
    --ok: #1f9d55;
    --warn: #b7791f;
    --danger: #c53030;
    --flash: #fff4c2;
    --shadow: 0 8px 28px rgb(0 0 0 / .14);
    --text-size: 17px;
    --trans-size: 16px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141414;
      --surface: #1c1c1c;
      --surface-me: #1a2433;
      --border: #2c2c2c;
      --text: #ececea;
      --muted: #9a9a95;
      --faint: #66665f;
      --accent: #6b9cf5;
      --korean: #e8c64a;
      --on-accent: #0d1420;
      --ok: #3fbf74;
      --warn: #d9a441;
      --danger: #f07070;
      --flash: #3a3417;
      --shadow: 0 8px 28px rgb(0 0 0 / .5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141414;
    --surface: #1c1c1c;
    --surface-me: #1a2433;
    --border: #2c2c2c;
    --text: #ececea;
    --muted: #9a9a95;
    --faint: #66665f;
    --accent: #6b9cf5;
    --korean: #e8c64a;
    --on-accent: #0d1420;
    --ok: #3fbf74;
    --warn: #d9a441;
    --danger: #f07070;
    --flash: #3a3417;
    --shadow: 0 8px 28px rgb(0 0 0 / .5);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
    display: flex;
    flex-direction: column;
  }
  button, input, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* ---- Top bar */
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: relative; z-index: 3;
  }
  .logo { width: 26px; height: 26px; object-fit: contain; }
  .session button svg { width: 16px; height: 16px; fill: currentColor; display: block; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 650; letter-spacing: -0.01em; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .dot.live { background: var(--ok); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 50%, transparent); }
                     70% { box-shadow: 0 0 0 6px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  .beta { margin-left: 2px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border);
          color: var(--muted); font-size: 11px; font-weight: 500; letter-spacing: 0; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--muted); white-space: nowrap;
  }
  .chip svg { width: 14px; height: 14px; }
  .chip.on { color: var(--text); }
  .mic-btn .mic-slash { display: none; }
  .mic-btn.off { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); }
  .mic-btn.off .mic-slash { display: block; }
  .mic-btn:disabled { opacity: .45; cursor: not-allowed; }
  .chip.off { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--border)); }
  .spacer { flex: 1; }
  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .switch input { position: absolute; opacity: 0; pointer-events: none; }
  .track { width: 34px; height: 20px; border-radius: 999px; background: var(--border); position: relative; transition: background .15s; flex: none; }
  .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
                  background: var(--surface); box-shadow: 0 1px 2px rgb(0 0 0 / .25); transition: transform .15s; }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(14px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
  .switch.disabled { opacity: .5; cursor: not-allowed; }

  .segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .segmented button { border: 0; background: transparent; padding: 4px 10px; cursor: pointer; color: var(--muted); }
  .segmented button + button { border-left: 1px solid var(--border); }
  .segmented button[aria-pressed="true"] { background: var(--bg); color: var(--text); font-weight: 600; }
  .segmented button:disabled { cursor: not-allowed; opacity: .5; }
  .segmented.voice button[data-mode="interpret"][aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .icon-btn svg { width: 17px; height: 17px; display: block; }
  .icon-btn:has(> svg) { line-height: 0; padding: 5px 7px; }
  /* A short explanation under a button when the pointer rests on it (like Windows settings) */
  [data-tip] { position: relative; }
  [data-tip]:hover::after, [data-tip]:focus-visible::after {
    content: attr(data-tip); position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%);
    width: max-content; max-width: 230px; padding: 7px 10px; border-radius: 8px; z-index: 60; pointer-events: none;
    background: var(--text); color: var(--bg); font-size: 12px; line-height: 1.4; font-weight: 400; text-align: left;
    white-space: normal; box-shadow: var(--shadow); animation: tip-in .12s .45s both;
  }
  [data-tip][data-tip-align="right"]:hover::after, [data-tip][data-tip-align="right"]:focus-visible::after { left: auto; right: 0; transform: none; }
  @keyframes tip-in { from { opacity: 0; } to { opacity: 1; } }
  .quit-btn { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); padding: 4px 7px; line-height: 0; }
  .quit-btn svg { width: 16px; height: 16px; }
  .quit-btn:hover { background: color-mix(in srgb, var(--danger) 10%, transparent); }
  .icon-btn { border: 1px solid var(--border); background: transparent; border-radius: 8px; padding: 4px 8px; cursor: pointer; color: var(--muted); }
  .icon-btn:hover, .segmented button:not(:disabled):hover { color: var(--text); }
  .stop-btn { border: 1px solid color-mix(in srgb, var(--danger) 45%, var(--border)); color: var(--danger);
              background: transparent; border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  .segmented.session button:disabled { opacity: .4; }
  .segmented.session .go:not(:disabled) { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .segmented.session .stop:not(:disabled) { color: var(--danger); }
  #paused { background: color-mix(in srgb, var(--warn) 14%, var(--surface)); color: var(--warn); font-weight: 600; }
  .stop-btn:hover { background: color-mix(in srgb, var(--danger) 10%, transparent); }

  /* ---- Settings panel */
  .panel-wrap { position: relative; }
  .txt-btn { display: inline-flex; align-items: center; gap: 6px; line-height: 1.2 !important; padding: 5px 10px !important; }
  .txt-btn svg { width: 16px; height: 16px; }
  .menu { position: absolute; top: calc(100% + 8px); min-width: 250px; max-width: 340px; z-index: 40; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; }
  .menu.right { right: 0; }
  .menu.wide { width: 330px; padding: 12px 14px; }
  .menu h4 { margin: 8px 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .menu h4:first-child { margin-top: 0; }
  .menu-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; color: var(--text);
    padding: 8px 10px; border-radius: 8px; cursor: pointer; font: inherit; }
  .menu-item:hover { background: var(--bg); }
  .menu-item .sp { flex: 1; }
  .menu-item kbd { color: var(--muted); font: inherit; font-size: 12px; }
  .menu .note { color: var(--muted); font-size: 12px; padding: 2px 10px 6px; }
  .menu .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .menu .row > span:first-child { color: var(--muted); min-width: 64px; }
  .menu select, .menu .full { width: 100%; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .menu input[type=range] { width: 100%; accent-color: var(--accent); }
  .menu .sizes { flex-wrap: nowrap; gap: 6px; }
  .menu .sizes > span:first-child { min-width: 0; }
  .menu .sizes .icon-btn { padding: 3px 8px; }
  .menu .sizes output { display: none; }
  .menu p { color: var(--muted); font-size: 12px; margin: 4px 0 10px; }

  #settings-panel {
    position: absolute; right: 0; top: calc(100% + 8px); width: 300px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow); padding: 14px 16px; z-index: 5;
  }
  #settings-panel h3 { margin: 0 0 10px; font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .setting { margin-bottom: 14px; }
  .setting label { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 4px; }
  .setting output { font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
  .setting input[type=range] { width: 100%; accent-color: var(--accent); }
  .setting p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }

  /* ---- Banners */
  .banner { display: none; padding: 8px 16px; border-bottom: 1px solid var(--border); }
  .banner.show { display: block; }
  #banner { background: color-mix(in srgb, var(--danger) 12%, var(--surface)); color: var(--danger); }
  #stopped { background: var(--surface); color: var(--muted); }

  /* ---- Transcript */
  main { flex: 1; overflow-y: auto; position: relative; }
  .grid { display: grid; grid-template-columns: 92px minmax(0, 1fr) minmax(0, 1fr); }
  body.view-original .grid, body.view-translation .grid { grid-template-columns: 92px minmax(0, 1fr); }
  body.view-original .col-translation, body.view-translation .col-original { display: none; }

  .colhead {
    position: sticky; top: 0; z-index: 1;
    background: var(--bg); border-bottom: 1px solid var(--border);
    color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
  }
  .colhead > div { padding: 8px 16px; }

  .row { border-bottom: 1px solid var(--border); background: var(--surface); }
  .row.me { background: var(--surface-me); }
  .row > div { padding: 10px 16px; }
  .meta { color: var(--muted); font-size: 12px; display: flex; flex-direction: column; gap: 2px; }
  .who { font-weight: 650; color: var(--text); }
  .row.me .who { color: var(--accent); }
  .lang { font-size: 10px; letter-spacing: .05em; color: var(--faint); }
  .text { font-size: var(--text-size); line-height: 1.5; overflow-wrap: anywhere; white-space: pre-wrap; }
  .col-original { border-right: 1px solid var(--border); }
  body.view-original .col-original { border-right: 0; }
  .pending { color: var(--faint); }
  .pending::after { content: "…"; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .none { color: var(--faint); }
  .failed { color: var(--danger); font-size: 13px; }
  .flash { animation: flash 1.4s ease-out; }
  @keyframes flash { from { background: var(--flash); } to { background: transparent; } }
  .voice-tag { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-size: 12px; font-weight: 600; }
  .voice-tag svg { width: 13px; height: 13px; }

  .note { grid-column: 1 / -1; text-align: center; color: var(--faint); font-size: 12px; padding: 6px 16px; }

  .summary { margin: 16px; padding: 16px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
  .summary h2 { margin: 0 0 8px; font-size: 16px; }
  .summary h4 { margin: 14px 0 4px; font-size: 14px; }
  .summary ul { margin: 0; padding-left: 20px; }
  .summary p { margin: 4px 0; }

  .empty { padding: 64px 24px; text-align: center; color: var(--muted); }
  .empty h2 { margin: 0 0 6px; font-size: 18px; color: var(--text); font-weight: 600; }
  .empty p { margin: 4px 0; }

  #jump {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    display: none; border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer;
    background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow); z-index: 2;
  }
  #jump.show { display: block; }
  .icon-btn[aria-pressed="true"] { color: var(--text); background: var(--bg); }
  /* ---- Beta footer: everything about the computer voice, small, at the very bottom */
  #beta { border-top: 1px solid var(--border); background: var(--surface); padding: 2px 16px 6px; font-size: 12px; color: var(--muted); }
  #beta summary { cursor: pointer; padding: 6px 0; }
  #beta .beta-body { padding: 4px 0 10px; display: flex; flex-direction: column; gap: 8px; max-width: 560px; }
  #beta .beta-row { display: flex; align-items: center; gap: 8px; }
  #beta .beta-row select { flex: 1; min-width: 0; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  #beta .beta-row input[type=range] { flex: 1; accent-color: var(--accent); }
  #beta p { margin: 0; }
  #speak { display: none; }

  #jump { bottom: 220px; }

  /* ---- Composer: English to say, from what Jun says in Korean or types */
  .oneline { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  #draft.answer { min-height: 130px; max-height: 40vh; font-size: var(--text-size); font-weight: 400; line-height: 1.5; }
  .flag { font-size: 20px; line-height: 1; }
  .dots { display: inline-flex; gap: 3px; align-items: center; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); animation: dot 1.2s infinite ease-in-out both; }
  .dots i:nth-child(2) { animation-delay: .2s; }
  .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes dot { 0%, 80%, 100% { opacity: .15; } 40% { opacity: 1; } }
  #draft.stale { color: var(--muted); }
  #composer-toggle svg { transition: transform .15s; }
  body.composer-folded #composer .pair > :not(.pane:first-child), body.composer-folded #type-form { display: none; }
  body.composer-folded .pair { grid-template-columns: 1fr; }
  body.composer-folded #composer-toggle svg { transform: rotate(-90deg); }
  .pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: stretch; }
  .pane { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .pane-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 26px; }
  .pane-head strong { font-size: 13px; }
  .arrow { align-self: center; font-size: 26px; color: var(--accent); line-height: 1; }
  #type-form { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; flex: 1; }
  #type-input { width: 100%; min-height: 56px; max-height: 160px; resize: vertical; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); font-size: calc(var(--text-size) + 2px); line-height: 1.45; }
  #type-input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  @media (max-width: 640px) { .pair { grid-template-columns: 1fr; } .arrow { transform: rotate(90deg); justify-self: center; } }
  #composer {
    border-top: 1px solid var(--border); background: var(--surface);
    padding: 10px 16px 12px; display: flex; gap: 8px; flex-direction: column;
  }
  .out-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-height: 18px; }
  .out-head strong { font-size: 13px; }
  #out-source { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .hint { color: var(--muted); font-size: 12px; }
  .warn { color: var(--warn); font-size: 12px; }
  #draft {
    width: 100%; min-height: 56px; max-height: 160px; resize: vertical;
    padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); font-size: calc(var(--text-size) + 2px); line-height: 1.45; font-weight: 500;
  }
  #draft:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #draft.translating { color: var(--faint); }
  .row-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .primary { border: 0; border-radius: 8px; padding: 6px 14px; background: var(--accent); color: var(--on-accent); cursor: pointer; font-weight: 600; }
  .primary:disabled { opacity: .45; cursor: not-allowed; }
  .ghost { border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; background: transparent; cursor: pointer; color: var(--muted); }
  .ghost:hover { color: var(--text); }
  .ghost:disabled { opacity: .45; cursor: not-allowed; }
  #speaking { color: var(--accent); font-size: 12px; font-weight: 600; }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; color: var(--muted); }
  #type-form { display: flex; gap: 8px; }
  #type-input {
    flex: 1; min-width: 0; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg);
  }
  #type-input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #history { display: flex; gap: 6px; flex-wrap: wrap; }
  #history button {
    max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; background: transparent;
    color: var(--muted); font-size: 12px; cursor: pointer;
  }
  #history button:hover { color: var(--text); }

  /* ---- Summary panel (over the right side; the meeting keeps going underneath) */
  #summary-panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw);
    background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--shadow);
    display: flex; flex-direction: column; z-index: 6;
  }
  .sp-head { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .sp-tabs { display: inline-flex; gap: 2px; }
  .sp-tabs button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 600; }
  .sp-tabs button[aria-selected="true"] { background: var(--bg); color: var(--text); }
  #sp-title { color: var(--muted); font-size: 12px; }
  #sp-body { flex: 1; overflow-y: auto; padding: 4px 20px 16px; }
  .qa { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .qa .q { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  .qa .a { font-size: calc(var(--text-size) - 1px); line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .qa .a.thinking { color: var(--faint); }
  .qa .a.failed { color: var(--danger); font-size: 13px; }
  #type-mode { flex: none; }
  #sp-body h4 { margin: 16px 0 4px; font-size: 14px; }
  #sp-body ul { margin: 0; padding-left: 20px; }
  #sp-body li { margin: 3px 0; }
  #sp-body p { margin: 4px 0; }
  #sp-body .waiting { color: var(--muted); padding-top: 16px; }
  #tune-reset-all { white-space: nowrap; flex: none; }
  #tune-body { flex: 1; overflow-y: auto; padding: 4px 16px 16px; }
  #tune-body details { border-bottom: 1px solid var(--border); padding: 6px 0; }
  #tune-body summary { cursor: pointer; font-weight: 650; display: flex; align-items: center; gap: 8px; }
  #tune-body .gdesc { color: var(--muted); font-size: 12px; margin: 4px 0 8px; }
  .tune { display: grid; grid-template-columns: 1fr 96px; gap: 2px 10px; align-items: center; margin: 8px 0; }
  .tune label { font-weight: 550; display: flex; align-items: center; gap: 6px; }
  .tune .h { grid-column: 1 / -1; color: var(--muted); font-size: 12px; line-height: 1.35; }
  .tune input[type=number] { width: 96px; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .tune textarea { grid-column: 1 / -1; width: 100%; min-height: 54px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; }
  .tune .def { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); visibility: hidden; flex: none; }
  .tune.changed .def { visibility: visible; }
  .tune.bool { grid-template-columns: 1fr auto; }
  #prep-body { flex: 1; overflow-y: auto; padding: 8px 20px 16px; display: flex; flex-direction: column; gap: 8px; }
  #welcome { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 32px 16px; }
  #welcome[hidden] { display: none; }
  .wl-card { width: min(640px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px 28px; box-shadow: var(--shadow); }
  .wl-logo { width: 56px; height: 56px; object-fit: contain; }
  .wl-card h2 { margin: 8px 0 12px; font-size: 20px; }
  #wl-points { padding-left: 20px; margin: 0 0 14px; }
  #wl-points li { margin: 8px 0; line-height: 1.5; }
  .wl-agree { display: flex; gap: 8px; align-items: flex-start; font-weight: 600; margin: 12px 0 4px; }
  #wl-key-input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; }
  dialog { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); color: var(--text); padding: 18px 20px; max-width: 420px; box-shadow: var(--shadow); }
  dialog::backdrop { background: rgb(0 0 0 / .35); }
  dialog h3 { margin: 0 0 6px; font-size: 16px; }
  dialog select { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); margin: 6px 0; }
  .dlg-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
  .bg-selected { font-weight: 600; margin: 6px 0 2px; }
  .bg-item.chosen { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok) inset; }
  .bg-item.editing .bg-head { background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 10px 10px 0 0; }
  .bg-tick { width: 18px; height: 18px; accent-color: var(--ok); flex: none; cursor: pointer; }
  .bg-head .trash { padding: 2px 6px; border-color: transparent; }
  #sd-list { margin: 8px 0; display: flex; flex-direction: column; gap: 4px; max-height: 40vh; overflow-y: auto; }
  .sd-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
  .sd-row .sd-ttl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sd-row .meta { font-size: 12px; color: var(--muted); }
  .bg-item { border: 1px solid var(--border); border-radius: 10px; margin: 8px 0; background: var(--bg); }
  .bg-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; cursor: pointer; }
  .bg-head .ttl { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bg-head .badge { font-size: 11px; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 0 7px; }
  .bg-head .meta { font-size: 12px; color: var(--muted); }
  .bg-body { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px; }
  .bg-body input[type=text], .bg-body textarea { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; }
  .bg-body textarea { min-height: 120px; max-height: 40vh; resize: vertical; line-height: 1.45; }
  #prep-context { min-height: 0; max-height: 50vh; resize: vertical; overflow-y: auto; line-height: 1.45; font: inherit; }
  #prep-body input[type=text], #prep-context { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  #prep-save { white-space: nowrap; flex: none; }
  .prep-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .term { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; margin-bottom: 4px; }
  .term input { min-width: 0; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .sp-foot { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
  .note button { border: 0; background: transparent; color: var(--accent); cursor: pointer; font-size: 12px; text-decoration: underline; }

  /* ---- Bubble layout (the default): one bubble per line, English large, the translation below in grey.
     It restyles the same row elements as the table layout, so translations that arrive later,
     revisions and the replay after a reconnect all work as before. */
  body.layout-bubbles .colhead { display: none; }
  body.layout-bubbles #rows { max-width: 920px; margin: 0 auto; padding: 14px 16px 55vh; display: flex; flex-direction: column; gap: 10px; }
  body.layout-bubbles .grid:not(.row):not(.colhead) { display: block; }
  body.layout-bubbles .grid.row { display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px 12px; }
  body.layout-bubbles .row > div { padding: 0; }
  body.layout-bubbles .meta { flex-direction: row; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  body.layout-bubbles .col-original { border-right: 0; }
  body.layout-bubbles .col-original .text { font-weight: 550; }
  body.layout-bubbles .col-translation { margin-top: 6px; }
  body.layout-bubbles .col-translation .text { font-size: var(--trans-size); color: var(--korean); }
  body.layout-bubbles .col-translation .text.pending, body.layout-bubbles .col-translation .text.none { color: var(--faint); }
  body.layout-bubbles .col-translation .text.none { color: var(--faint); }
  body.layout-bubbles .col-translation .text.failed { color: var(--danger); }
  body.layout-bubbles .row.me { margin-left: auto; width: min(82%, 680px); background: var(--surface-me); opacity: .9; }
  body.layout-bubbles .row.me .col-original .text { font-size: calc(var(--text-size) - 2px); font-weight: 400; }
  /* a line that is still being spoken: outlined, grey, filled in as words arrive, replaced when it is final */
  .col-original .text .draft { color: var(--muted); font-weight: 400; }
  @keyframes tfade { from { opacity: 0; } to { opacity: 1; } }
  .col-translation .text.arrived { animation: tfade .25s ease-out; }
  .col-translation .text.pending { letter-spacing: 2px; }
  .row.live { box-shadow: inset 3px 0 0 var(--accent); }
  .row.live .col-original .text { color: var(--muted); font-style: italic; }
  body.layout-bubbles .row.live { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }

  /* ---- Compact: only the meeting buttons and the transcript, for a small window */
  body.compact header .chips, body.compact #meeting-wrap, body.compact #dev-wrap,
  body.compact #composer, body.compact #beta, body.compact .brand .beta, body.compact .meta .lang { display: none; }
  body.compact header { padding: 6px 10px; gap: 8px; }
  body.compact.layout-bubbles #rows { padding: 8px 8px 16px; gap: 6px; }
  body.compact.layout-bubbles .grid.row { padding: 6px 10px 8px; border-radius: 10px; }

  @media (max-width: 720px) {
    .grid, body.view-original .grid, body.view-translation .grid { grid-template-columns: minmax(0, 1fr); }
    .colhead { display: none; }
    .meta { flex-direction: row; gap: 8px; padding-bottom: 0 !important; }
    .col-original { border-right: 0; padding-bottom: 4px !important; }
    .col-translation { padding-top: 0 !important; }
    .col-translation .text { color: var(--muted); }
    .menu.wide { width: min(330px, calc(100vw - 32px)); }
  }
</style>
</head>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const rowsEl = $("rows"), scroller = $("scroller");
  const lines = new Map();          // line id -> translation cell element
  let translateOn = false, translateAvailable = false, replaying = true, source = null;
  let micAvailable = true;
  let voice = { available: false, mode: "direct" }, micOn = false;

  const store = {
    get(key, fallback) { try { return localStorage.getItem(key) ?? fallback; } catch { return fallback; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch {} },
  };
  const post = (path, body = {}) => fetch(path, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });

  // ---- Scrolling. A new bubble is placed once, about 40% down the window, and then stays put while it fills in (English,
  // then the Korean in its reserved space). The page only scrolls again when the newest bubble grows past the bottom, or
  // when the next bubble starts. Reading back up stops the following; the jump button returns.
  let follow = true, lastAuto = 0, autoUntil = 0;
  const relTop = (node) => node.getBoundingClientRect().top - scroller.getBoundingClientRect().top + scroller.scrollTop;
  function scrollAuto(top, smooth) {
    top = Math.max(0, Math.round(top));
    lastAuto = top;
    autoUntil = Date.now() + (smooth ? 500 : 80);
    scroller.scrollTo({ top, behavior: smooth ? "smooth" : "auto" });
  }
  scroller.addEventListener("scroll", () => {
    if (Date.now() < autoUntil) return;
    follow = scroller.scrollTop >= lastAuto - 60;
    if (follow) $("jump").classList.remove("show");
  });
  function added(row) {
    if (!follow) { $("jump").classList.add("show"); return; }
    if (row) { scrollAuto(Math.max(relTop(row) - scroller.clientHeight * 0.4, lastAuto), !replaying); return; }   // a new bubble: placed once
    const last = rowsEl.lastElementChild;
    if (!last) return;
    const overflow = relTop(last) + last.offsetHeight - (scroller.scrollTop + scroller.clientHeight - 24);
    if (overflow > 0) scrollAuto(scroller.scrollTop + overflow, false);   // only as far as the growing bubble needs
  }
  function jumpToLatest() {
    follow = true;

    scrollAuto(last ? Math.max(relTop(last) - scroller.clientHeight * 0.4, 0) : 0, false);
    $("jump").classList.remove("show");
  }

  // ---- Rows
  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;

  }
  const SPEAKER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>';

  // A line that is still being spoken (a "partial" event from the server): an outlined bubble that fills in,
  // then is replaced by the final line. {source, text, translation?, clear?}. Not part of the replay.
  const partials = new Map();      // source -> { row, text, ttext }
  function clearPartial(sourceName) {
    const p = partials.get(sourceName);
    if (p) { (p.row || p.span).remove(); partials.delete(sourceName); }
  }
  function clearPartials() { for (const name of [...partials.keys()]) clearPartial(name); }
  function setPartial(e) {
    if (replaying) return;
    if (e.clear) return clearPartial(e.source);
    $("empty").style.display = "none";
    let p = partials.get(e.source);
    // A draft that will continue the open bubble grows inside it, in grey, instead of starting a bubble below.
    const open = openBubbles.get(e.source);
    const next = open && open.row.nextElementSibling;
    if (e.text && e.bubble != null && open && open.bubble === e.bubble && open.row.isConnected && (!next || next.classList.contains("live"))) {
      if (p && !p.span) { clearPartial(e.source); p = null; }
      if (!p) {
        p = { span: el("span", "draft") };
        open.otext.append(p.span);
        partials.set(e.source, p);
      }
      p.span.textContent = " " + e.text;
      added();
      return;
    }
    if (p && p.span) { clearPartial(e.source); p = null; }
    if (!p) {
      const me = e.source === "MIC";
      const row = el("div", "grid row live" + (me ? " me" : ""));
      const meta = el("div", "meta");
      meta.append(el("span", "who", me ? "나" : "상대"), el("span", "", e.time || ""), el("span", "lang", "…"));
      const original = el("div", "col-original"), text = el("div", "text pending", "");
      original.append(text);
      const translation = el("div", "col-translation"), ttext = el("div", "text none", "");
      translation.append(ttext);
      row.append(meta, original, translation);
      rowsEl.append(row);
      p = { row, text, ttext };
      partials.set(e.source, p);
    }
    p.text.className = "text" + (e.text ? "" : " pending");
    p.text.textContent = e.text || "";
    p.ttext.className = "text" + (e.translation ? "" : " none");
    p.ttext.textContent = e.translation || (translateOn && e.text ? "…" : "");
    added();
  }

  // Lines cut in the middle of a sentence share a bubble: the server numbers it ("bubble" = id of its first line).
  // The translation belongs to the whole bubble and is redone as the bubble grows.
  const openBubbles = new Map();   // source -> { bubble, row, otext }

  function addLine(e) {
    clearPartial(e.source);
    $("empty").style.display = "none";
    const prev = openBubbles.get(e.source);
    if (prev && e.bubble !== undefined && prev.bubble === e.bubble && prev.row.isConnected) {
      prev.otext.append(" ", el("span", "", e.text));
      reserve(prev);
      added();
      return;
    }
    const me = e.source === "MIC";
    const row = el("div", "grid row" + (me ? " me" : ""));
    const meta = el("div", "meta");
    meta.append(el("span", "who", me ? "나" : "상대"), el("span", "", e.time), el("span", "lang", e.lang.toUpperCase()));
    const original = el("div", "col-original");
    const otext = el("div", "text", e.text);
    original.append(otext);
    const translation = el("div", "col-translation");
    const cell = translateOn ? el("div", "text pending", "···") : el("div", "text none", "—");
    translation.append(cell);
    row.append(meta, original, translation);
    rowsEl.append(row);
    for (const p of partials.values()) if (p.row) rowsEl.append(p.row);   // a line still being spoken stays last
    lines.set(e.id, cell);
    const open = { bubble: e.bubble ?? e.id, row, otext, cell };
    openBubbles.set(e.source, open);
    reserve(open);
    added(row);
  }

  // The Korean cell keeps the height of the English above it from the start, so its arrival does not push the next bubbles.
  function reserve(open) {
    if (open.cell && open.cell.classList.contains("pending")) open.cell.style.minHeight = Math.round(open.otext.offsetHeight * 0.9) + "px";
  }

  function setTranslation(e) {
    const cell = lines.get(e.id);
    if (!cell) return;
    const failed = e.text.startsWith("(translation failed");
    cell.className = "text" + (failed ? " failed" : "") + (replaying ? "" : " arrived");
    cell.textContent = e.text;
  }

  // The translation so far, while it is still arriving; the final translation event replaces it.
  function setPartialTranslation(e) {
    const cell = lines.get(e.id);
    if (!cell || replaying) return;
    cell.className = "text";
    cell.textContent = e.text;
    added();
  }

  function addSpoken(e) {
    $("empty").style.display = "none";
    const row = el("div", "grid row me");
    const meta = el("div", "meta");
    const tag = el("span", "voice-tag");
    tag.innerHTML = SPEAKER;
    tag.append("나");
    meta.append(tag, el("span", "", e.time || ""), el("span", "lang", "EN · VOICE"));
    const original = el("div", "col-original");
    original.append(el("div", "text", e.text));
    const translation = el("div", "col-translation");
    translation.append(el("div", "text none", "Said in the meeting"));
    row.append(meta, original, translation);
    rowsEl.append(row);
    added();
  }

  function addNote(text) {
    const row = el("div", "grid");
    row.append(el("div", "note", text));
    rowsEl.append(row);
    added();
  }

  // ---- Summary panel. A summary is Markdown with "## " headings and "*"/"-" bullets,
  // built here as text nodes. Each summary also leaves a note in the transcript to reopen it.
  function renderSummary(container, markdown) {
    container.replaceChildren();
    let list = null;
    for (const raw of markdown.split("\n")) {
      const line = raw.trim();
      if (!line) { list = null; continue; }
      const bullet = line.match(/^[*-]\s+(.*)$/);
      if (line.startsWith("#")) { list = null; container.append(el("h4", "", line.replace(/^#+\s*/, ""))); }
      else if (bullet) {
        if (!list) { list = el("ul"); container.append(list); }
        list.append(el("li", "", bullet[1].replace(/\*\*/g, "")));
      } else { list = null; container.append(el("p", "", line.replace(/\*\*/g, ""))); }
    }
  }

  function showTab(name) {

    $("tune-body").hidden = name !== "tune";

    $("sp-body").hidden = name !== "summary";
    $("foot-summary").hidden = name !== "summary";
    $("prep-body").hidden = name !== "prep";
    $("foot-prep").hidden = name !== "prep";
    if (name !== "summary") $("sp-title").textContent = "";
    $("summary-panel").hidden = false;
  }

  // ---- Tuning (developer): the server sends the list of values with groups, ranges and explanations
  let tuneSchema = null, tuneValues = {};
  function renderTuning(t) {
    if (!t) return;
    const typing = document.activeElement && $("tune-body").contains(document.activeElement);
    tuneValues = t.values;
    if (tuneSchema && typing) {   // do not rebuild under the cursor: only the dots
      for (const row of t.schema) {
        const box = document.querySelector(`.tune[data-key="${row.key}"]`);
        if (box) box.classList.toggle("changed", t.values[row.key] !== row.default);
      }
      return;
    }
    tuneSchema = t.schema;
    const body = $("tune-body");
    const open = new Set([...body.querySelectorAll("details[open]")].map((d) => d.dataset.group));
    body.replaceChildren(...t.groups.map(([id, title, desc]) => {
      const box = el("details");
      box.dataset.group = id;
      if (open.has(id) || !body.children.length && id === "noise") box.open = true;
      const head = el("summary", "", title);
      const reset = el("button", "ghost", "이 묶음 기본값");
      reset.type = "button";
      reset.style.marginLeft = "auto";
      reset.onclick = (ev) => { ev.preventDefault(); post("/settings", { tuning_reset: id }); };
      head.append(reset);
      box.append(head, el("div", "gdesc", desc));
      for (const row of t.schema.filter((r) => r.group === id)) box.append(tuneRow(row, t.values[row.key]));
      return box;
    }));
  }
  function tuneRow(row, value) {
    const box = el("div", "tune" + (row.kind === "bool" ? " bool" : "") + (value !== row.default ? " changed" : ""));

    const label = el("label"); label.append(el("span", "def"), el("span", "", row.label));
    box.append(label);
    const send = (v) => post("/settings", { tuning: { [row.key]: v } });
    if (row.kind === "bool") {
      const input = el("input"); input.type = "checkbox"; input.checked = !!value;
      input.onchange = () => send(input.checked);
      box.append(input);
    } else if (row.kind === "text") {

      area.onchange = () => send(area.value);
      box.append(area);
    } else {

  }

    $("wl-key-ok").disabled = false;
    $("wl-key-msg").textContent = e.error ? t("wlErr_" + e.error) : (e.saved ? t("wlSaved") : "");
    if (e.saved) { $("wl-key-ok").disabled = true; $("wl-key-input").disabled = true; }
  }

  function syncBackgrounds(e) {
    backgrounds = e.backgrounds || [];
    activeBackgrounds = e.active_backgrounds || [];
    maxBriefings = e.max_briefings || 3;
    const names = activeBackgrounds.map((id) => backgrounds.find((b) => b.id === id)).filter(Boolean).map((b) => b.title || b.topic);
    $("active-bg-note").textContent = names.length ? t("bgActive", names.join(", ")) : t("bgNoneActive");
    recentBackground = e.recent_background || null;
    renderBackgrounds();
  }

  // ---- Start asks which background this meeting uses; End asks whether to summarize
  function askStart() {
    const items = [...backgrounds].sort((a, b) => (b.used || b.updated).localeCompare(a.used || a.updated));
    if (!items.length) { post("/session", { action: "start", backgrounds: [] }); return; }   // nothing to choose from
    $("sd-title").textContent = t("sdTitle"); $("sd-help").textContent = t("sdHelp");
    $("sd-cancel").textContent = t("sdCancel"); $("sd-ok").textContent = t("sdStart");
    const preset = activeBackgrounds;   // exactly what was ticked at the last Start (nothing ticked stays nothing)
    const box = $("sd-list");
    box.replaceChildren(...items.map((b) => {
      const label = el("label", "sd-row");
      const tick = el("input"); tick.type = "checkbox"; tick.value = b.id; tick.checked = preset.includes(b.id);
      tick.onchange = () => {
        if (box.querySelectorAll("input:checked").length > maxBriefings) { tick.checked = false; $("sd-terms").textContent = t("bgMax", maxBriefings); }
        else $("sd-terms").textContent = "";
      };
      label.append(tick, el("span", "sd-ttl", b.title || b.topic || "—"), el("span", "meta", t("bgTermsN", b.terms.length)));
      return label;
    }));
    $("sd-terms").textContent = t("bgMax", maxBriefings);
    $("start-dialog").onclose = () => {
      if ($("start-dialog").returnValue === "ok") post("/session", { action: "start", backgrounds: [...box.querySelectorAll("input:checked")].map((i) => i.value) });
    };
    $("start-dialog").returnValue = "cancel";
    $("start-dialog").showModal();
  }
  function askEnd() {
    $("ed-title").textContent = t("edTitle"); $("ed-help").textContent = t("edHelp");
    $("ed-cancel").textContent = t("edCancel"); $("ed-no").textContent = t("edNo"); $("ed-yes").textContent = t("edYes");
    $("end-dialog").onclose = () => {
      const v = $("end-dialog").returnValue;
      if (v === "yes") post("/session", { action: "end", summarize: true });
      else if (v === "no") post("/session", { action: "end", summarize: false });
    };
    $("end-dialog").returnValue = "cancel";
    $("end-dialog").showModal();
  }

  function openSummaryPanel(title, markdown, message) {
    showTab("summary");
    $("sp-title").textContent = title;
    if (markdown) renderSummary($("sp-body"), markdown);
    else $("sp-body").replaceChildren(el("p", "waiting", message));
  }
  function requestSummary() {
    if (!translateAvailable) return;
    post("/summarize");
    openSummaryPanel(t("sumSoFar"), null, t("sumWorking"));
  }
  function onSummarizing(e) {
    if (!replaying && e.final) openSummaryPanel(t("sumFinal"), null, t("sumFinalWorking"));
  }
  let finalSummaryShown = false;   // the meeting summary was put on the screen: the tab stays open after Quit
  function onSummary(e) {
    if (e.final && e.text && !replaying) finalSummaryShown = true;
    if (!e.text) {
      if (!replaying) openSummaryPanel(t("sumSoFar"), null, t("sumNothing"));
      return;
    }
    const row = el("div", "grid");
    const note = el("div", "note");
    const button = el("button", "", e.final ? t("sumNoteFinal", e.time) : t("sumNoteSo", e.time));
    button.onclick = () => openSummaryPanel(summaryTitle(e), e.text);
    note.append(button);
    row.append(note);
    rowsEl.append(row);
    added();
    if (!replaying) openSummaryPanel(summaryTitle(e), e.text);
  }
  $("summary-btn").onclick = requestSummary;
  $("sp-again").onclick = requestSummary;
  $("sp-close").onclick = () => { $("summary-panel").hidden = true; };

  // ---- Status and settings
  const ICONS = {
    headphones: '<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/>',
    speakers: '<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>',
  };
  function setStatus(e) {
    micOn = e.mic;
    $("output-icon").innerHTML = ICONS[e.kind] || ICONS.speakers;
    $("output-text").textContent = e.output ? t("outputOn", e.output) : t("outputNone");
    $("output-chip").className = "chip on";
    micAvailable = e.mic_available !== false;
    const mic = $("mic-chip");
    mic.classList.toggle("off", !e.mic);
    mic.setAttribute("aria-pressed", e.mic);
    mic.disabled = !micAvailable;
    mic.dataset.tip = !micAvailable ? t("micNone") : e.mic ? t("micOn") : e.kind === "speakers" ? t("micSpeakers") : t("micOff");
    updateDraftWarning();
  }

  function setSettings(e) {
    renderTuning(e.tuning);
    updateWelcome(e);
    syncBackgrounds(e);
    if (e.models) {
      const gone = Object.entries(e.models.missing || {}).map(([role, ids]) => `${role}: ${ids.join(", ")}`).join("; ");
      $("models-status").textContent = !e.models.checked ? "" : gone ? t("mModelsGone", gone) : t("mModelsOk");
    }
    translateOn = e.translate;
    translateAvailable = e.translate_available;
    $("translate-off").checked = !translateOn;
    $("translate-off").disabled = !translateAvailable;
    setView(translateOn ? "both" : "original");
    $("empty-hint").textContent = translateAvailable ? ""
      : t("noKey");
    if (document.activeElement !== $("max-line")) $("max-line").value = e.max_line_seconds;
    if (document.activeElement !== $("pause")) $("pause").value = e.pause_seconds;
    $("max-line-out").textContent = `${Number(e.max_line_seconds)} s`;
    $("pause-out").textContent = `${Number(e.pause_seconds).toFixed(1)} s`;
    if (document.activeElement !== $("mic-filter")) $("mic-filter").value = e.mic_filter;
    if (document.activeElement !== $("translate-model")) $("translate-model").value = e.translate_model || "auto";
    if (document.activeElement !== $("speech-model")) $("speech-model").value = e.speech_model || "turbo";
    updateDraftWarning();
  }
  $("translate-model").addEventListener("change", () => post("/settings", { translate_model: $("translate-model").value }));
  $("speech-model").addEventListener("change", () => post("/settings", { speech_model: $("speech-model").value }));
  $("mic-filter").addEventListener("change", () => post("/settings", { mic_filter: $("mic-filter").value }));

  $("translate-off").addEventListener("change", () => post("/settings", { translate: !$("translate-off").checked }));

  for (const [id, key, digits] of [["max-line", "max_line_seconds", 0], ["pause", "pause_seconds", 1]]) {
    $(id).addEventListener("input", () => { $(id + "-out").textContent = `${Number($(id).value).toFixed(digits)} s`; });
    $(id).addEventListener("change", () => post("/settings", { [key]: Number($(id).value) }));
  }

  // The voice state is only remembered: the Avatar voice is not in the page any more.
  function setVoice(e) {
    voice = e;
    updateDraftWarning();
    updateButtons();
  }

  function updateDraftWarning() {
    $("draft-warn").textContent = !translateOn ? t("transOffWarn") : "";
  }

  // ---- Typing translator: what Jun types (only that) is translated as he types: Korean -> English to say,
  // English -> Korean to check the meaning. Spoken lines are translated in their bubbles, not here.
  // Typed text is never recorded.
  let latestTyped = 0;        // id of the newest typing request, so older answers do not overwrite
  let lastSent = "", typeTimer = null;
  const TYPE_PAUSE_MS = 600;  // a pause in typing this long sends what is there

  function updateButtons() {}
  function setOutput(text, language = "English") {
    $("dots").hidden = true;
    $("draft").classList.remove("stale");
    $("draft").value = text;
    $("out-title").textContent = language === "ask" ? "💬" : language === "English" ? "🇬🇧" : "🇰🇷";
    $("out-title").setAttribute("aria-label", language);
    $("draft").classList.remove("answer", "failed");
    $("out-q").textContent = "";
  }
  function discard() {
    clearTimeout(typeTimer);
    lastSent = "";
    $("type-input").value = "";
    setOutput("");
  }
  $("discard").onclick = discard;
  $("draft").addEventListener("keydown", (e) => { if (e.key === "Escape") { e.preventDefault(); discard(); } });

  function sendTyped() {
    clearTimeout(typeTimer);
    const text = $("type-input").value.trim();
    if (!translateAvailable || typeKind !== "translate" || /^[?？]/.test(text)) return;
    if (!text) { lastSent = ""; setOutput(""); return; }
    if (text === lastSent) return;
    lastSent = text;
    post("/type", { text });
  }

  // Translate (as you type) or Ask (a question about the meeting, answered in the side panel, sent with Enter).
  // A leading "?" asks whatever the mode.
  let typeKind = "translate";
  function setTypeKind(kind) {
    typeKind = kind;
    document.querySelectorAll("#type-mode button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.kind === kind));
    $("type-input").placeholder = t(kind === "ask" ? "phAsk" : "phType");
  }
  $("type-input").addEventListener("input", () => {
    clearTimeout(typeTimer);
    typeTimer = setTimeout(sendTyped, TYPE_PAUSE_MS);
  });
  $("type-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("type-form").requestSubmit(); }
    if (e.key === "Escape") { e.preventDefault(); discard(); }
  });
  document.querySelectorAll("#type-mode button").forEach((b) => b.onclick = () => { setTypeKind(b.dataset.kind); $("type-input").focus(); });
  $("type-form").addEventListener("submit", (e) => {
    e.preventDefault();
    let text = $("type-input").value.trim();
    if (!text || !translateAvailable) return;
    if (typeKind === "ask" || /^[?？]/.test(text)) {
      text = text.replace(/^[?？]\s*/, "");
      if (!text) return;
      post("/ask", { question: text });
      $("type-input").value = "";
    } else sendTyped();
  });

  function setFolded(folded) {
    document.body.classList.toggle("composer-folded", folded);
    $("composer-toggle").setAttribute("aria-expanded", !folded);
    store.set("folded", folded ? "1" : "0");
  }
  $("composer-toggle").onclick = () => setFolded(!document.body.classList.contains("composer-folded"));
  setFolded(store.get("folded", "0") === "1");

  // A question about the meeting is answered in the same box as a translation: the newest request owns the box.
  let boxOwner = "";
  function updateAskLeft(e) {
    if (e.left === undefined) return;
    document.querySelector("#type-mode [data-kind=ask]").title = t("askLeft", e.left, e.limit);
  }
  function onAsking(e) {
    boxOwner = "ask:" + e.id;
    updateAskLeft(e);
    if (replaying) return;
    setOutput("", "ask");
    $("out-q").textContent = e.question;
    $("draft").classList.add("answer", "stale");
    $("draft").value = t("asking");
    $("dots").hidden = false;
  }
  function onAnswer(e) {
    updateAskLeft(e);
    if (e.blocked) {   // not sent: too long, too soon, or today's limit
      if (replaying) return;
      boxOwner = "ask:" + e.id;
      setOutput(t("askBlocked_" + e.blocked, e.limit), "ask");
      $("out-q").textContent = e.question;
      $("draft").classList.add("answer");
      return;
    }
    if (replaying || boxOwner !== "ask:" + e.id) return;
    const failed = e.text.startsWith("(answer failed");
    setOutput(e.text, "ask");
    $("out-q").textContent = e.question;
    $("draft").classList.add("answer");
    $("draft").classList.toggle("failed", failed);
  }
  function onTyping(e) {
    latestTyped = Math.max(latestTyped, e.id);
    boxOwner = "typed:" + e.id;
    if (replaying) return;
    $("draft").classList.remove("answer");
    $("out-q").textContent = "";
    $("draft").classList.add("stale");   // the earlier translation stays, dimmed, until the new one arrives
    $("dots").hidden = false;
  }
  function onTyped(e) {
    if (replaying || e.id !== latestTyped || boxOwner !== "typed:" + e.id) return;
    if (!e.target) { setOutput(e.text || ""); return; }
    setOutput(e.text, e.target);
  }

  // ---- View, text size, settings panel, stop
  function setView(view) {
    document.body.classList.remove("view-both", "view-original", "view-translation");
    document.body.classList.add("view-" + view);
  }

  let size = Number(store.get("size", 17));
  function setSize(px) {
    size = Math.min(28, Math.max(13, px));
    document.documentElement.style.setProperty("--text-size", size + "px");
    $("size-out").textContent = `${size} px`;
    store.set("size", size);
  }
  $("smaller").onclick = () => setSize(size - 2);
  $("larger").onclick = () => setSize(size + 2);
  setSize(size);

  let tsize = Number(store.get("tsize", 16));
  function setTSize(px) {
    tsize = Math.min(28, Math.max(12, px));
    document.documentElement.style.setProperty("--trans-size", tsize + "px");
    $("tsize-out").textContent = `${tsize} px`;
    store.set("tsize", tsize);
  }
  $("t-smaller").onclick = () => setTSize(tsize - 2);
  $("t-larger").onclick = () => setTSize(tsize + 2);
  setTSize(tsize);


  function setCompact(on) {
    document.body.classList.toggle("compact", on);
    $("compact-switch").checked = on;
    store.set("compact", on ? "1" : "0");
  }
  $("compact-switch").onchange = () => setCompact($("compact-switch").checked);
  setCompact(store.get("compact", "0") === "1");

  // The Mac app's menu bar (Anne.app) calls these; they do what the page's own buttons do.
  window.anne = {
    start: () => $("btn-start").click(), pauseResume: () => $("btn-pause").click(), end: () => $("btn-end").click(),
    summary: () => requestSummary(), background: () => showTab("prep"), tuning: () => showTab("tune"),
    ask: () => { setTypeKind("ask"); $("type-input").focus(); },
    mic: () => $("mic-chip").click(), theme: (mode) => setTheme(mode), compact: () => $("compact-switch").click(),
    translateOff: () => $("translate-off").click(), openView: () => $("menu-view-btn").click(), developerMenu: () => $("dev-tools").click(),
    textSize: (step) => { if (step === 0) { setSize(17); setTSize(16); } else { setSize(size + 2 * step); setTSize(tsize + 2 * step); } },
  };

  function closeMenus(except) {
    document.querySelectorAll(".menu").forEach((m) => { if (m.id !== except) m.hidden = true; });
    document.querySelectorAll("[data-menu]").forEach((b) => b.setAttribute("aria-expanded", !$(b.dataset.menu).hidden));
  }
  document.querySelectorAll("[data-menu]").forEach((b) => b.onclick = (ev) => {
    ev.stopPropagation();
    const menu = $(b.dataset.menu), open = menu.hidden;
    closeMenus(open ? menu.id : "");
    menu.hidden = !open;
    b.setAttribute("aria-expanded", open);
  });
  document.addEventListener("click", (ev) => { if (!ev.target.closest(".panel-wrap")) closeMenus(); });
  document.querySelectorAll(".menu-item").forEach((b) => b.addEventListener("click", () => closeMenus()));

  function setTheme(mode) {
    if (mode === "light" || mode === "dark") document.documentElement.dataset.theme = mode; else delete document.documentElement.dataset.theme;
    document.querySelectorAll("#theme-buttons button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.theme === (mode || "auto")));
    store.set("theme", mode || "auto");
  }
  document.querySelectorAll("#theme-buttons button").forEach((b) => b.onclick = () => setTheme(b.dataset.theme));
  setTheme(store.get("theme", "auto"));

  // ---- The meeting: Start | Pause / Resume | End. Quit (in Settings) closes the program.
  let sessionState = "running";
  const ICON = {
    play: '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>',
    pause: '<svg viewBox="0 0 24 24"><path d="M6 4.5h4v15H6zM14 4.5h4v15h-4z"/></svg>',
    stop: '<svg viewBox="0 0 24 24"><rect x="5.5" y="5.5" width="13" height="13" rx="1.5"/></svg>',
  };
  function onSession(e) {
    sessionState = e.state;
    const running = e.state === "running", paused = e.state === "paused";
    $("btn-start").disabled = e.state !== "idle";
    $("btn-pause").disabled = !(running || paused);
    $("btn-pause").innerHTML = paused ? ICON.play : ICON.pause;
    $("btn-pause").setAttribute("aria-label", t(paused ? "miResume" : "miPause"));
    $("btn-pause").dataset.action = paused ? "resume" : "pause";
    $("btn-pause").dataset.tip = t(paused ? "tipResume" : "tipPause");
    $("btn-end").disabled = !(running || paused);
    $("btn-end").dataset.tip = t(e.state === "ending" ? "tipEnding" : "tipEnd");
    showEmpty(running || paused);
    $("paused").classList.toggle("show", paused);
    $("live").classList.toggle("live", running);
    if (e.new) {                       // a new meeting: start with an empty page
      rowsEl.replaceChildren(); lines.clear(); partials.clear(); openBubbles.clear();
      $("summary-panel").hidden = true;
      $("empty").style.display = "";
      clearOutput();
      $("stopped").classList.remove("show");
    }
    if (e.state === "idle" && e.fresh) {
      $("stopped").classList.remove("show");   // the program just started: nothing has ended
    } else if (e.state === "idle") {
      $("stopped").textContent = e.saved ? t("sEndedSaved", e.saved) : t("sEndedEmpty");
      $("stopped").classList.add("show");
    }
  }
  document.querySelectorAll("#session-buttons button").forEach((b) => b.onclick = () => {
    if (b.dataset.action === "start") return askStart();
    if (b.dataset.action === "end") return askEnd();
    post("/session", { action: b.dataset.action });
  });
  $("quit").onclick = () => {
    if (confirm(t("quitConfirm"))) post("/quit");
  };

  document.addEventListener("keydown", (e) => {
    // Shortcuts are for when nothing is being typed or picked. Typing a letter in the voice list
    // would otherwise start a summary, and Enter on it would speak the draft.
    const tag = e.target.tagName;
    if (e.metaKey || e.ctrlKey || e.altKey || ["INPUT", "TEXTAREA", "SELECT"].includes(tag)) return;
    if (tag === "BUTTON" && (e.key === "Enter" || e.key === " ")) return;
    if (e.key === "Escape") { closeMenus(); $("summary-panel").hidden = true; }
    if (e.key === "/") { e.preventDefault(); $("type-input").focus(); }
    if (e.key === "?") { e.preventDefault(); setTypeKind("ask"); $("type-input").focus(); }
    if (e.key === "s") requestSummary();
    if (e.key === "c") $("compact-switch").click();
    if (e.altKey && e.shiftKey && e.code === "KeyD") { $("dev-tools").click(); }
    if (e.key === "p" && !$("btn-pause").disabled) $("btn-pause").click();
  });

  // ---- Live events. On every (re)connect the server replays the session, so start clean.
  function stopped(e) {
    source.close();
    clearPartials();
    $("live").classList.remove("live");
    $("banner").classList.remove("show");
    $("stopped").textContent = e.saved ? t("sClosedSaved", e.saved) : t("sClosedEmpty");
    $("stopped").classList.add("show");
    // A tab opened by the program itself (one history entry) may close itself; if the browser refuses, the message stays.
    // It stays open when the meeting summary was just shown, so it can be read first.
    if (!finalSummaryShown) setTimeout(() => { try { window.close(); } catch {} }, 1200);
    document.body.classList.remove("interpreting");
    for (const id of ["btn-start", "btn-pause", "btn-end", "summary-btn", "sp-again", "type-input"]) $(id).disabled = true;
    $("paused").classList.remove("show");
  }

  function connect() {
    source = new EventSource("/events");
    source.onopen = () => {
      replaying = true;
      rowsEl.replaceChildren(); lines.clear(); partials.clear(); openBubbles.clear();
      $("empty").style.display = "";
      $("banner").classList.remove("show");
      $("live").classList.add("live");
    };
    source.onerror = () => {
      $("banner").classList.add("show");
      $("live").classList.remove("live");
    };
    source.onmessage = (message) => {
      const e = JSON.parse(message.data);
      switch (e.type) {
        case "line": addLine(e); break;
        case "partial": setPartial(e); break;
        case "translation": setTranslation(e); break;
        case "translation_partial": setPartialTranslation(e); break;
        case "status": setStatus(e); break;
        case "settings": setSettings(e); break;
        case "model": $("loading").classList.toggle("show", e.state === "loading"); break;
        case "prep_result": onPrepResult(e); break;
        case "welcome": onWelcome(e); break;
        case "session": onSession(e); break;
        case "voice": setVoice(e); break;
        case "draft": break;   // spoken Korean is translated in its bubble; the bottom box is for typing only
        case "spoken": addSpoken(e); break;
        case "summarizing": onSummarizing(e); break;
        case "summary": onSummary(e); break;
        case "typing": onTyping(e); break;
        case "typed": onTyped(e); break;
        case "asking": onAsking(e); break;
        case "answer": onAnswer(e); break;
        case "info": addNote(e.text); break;
        case "stopped": stopped(e); break;
        case "live": replaying = false; jumpToLatest(); break;
      }
    };
  }
  connect();
})();
</script>
</body>
</html>
