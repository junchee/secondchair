<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yourAccent</title>
<style>
  :root {
    --bg: #faf8f5; --panel: #ffffff; --text: #1f2328; --muted: #6b7280; --line: #e5e0d8;
    --accent: #2f5d8a; --accent-text: #ffffff; --good: #2e7d4f; --good-bg: #e6f3ea;
    --bad: #b3402a; --bad-bg: #f9e8e4; --warn: #8a6a12; --warn-bg: #f7efd5; --dot: #d7d2c9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17191c; --panel: #212428; --text: #e8e6e1; --muted: #9aa0a8; --line: #343a40;
      --accent: #7fb0e0; --accent-text: #10151a; --good: #6fcf97; --good-bg: #1d3327;
      --bad: #f08c78; --bad-bg: #3a2420; --warn: #e3c566; --warn-bg: #38311b; --dot: #3d434a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 -apple-system, "Apple SD Gothic Neo", "Helvetica Neue", sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .brand { font-weight: 700; font-size: 20px; letter-spacing: .2px; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; }
  nav button { border-color: transparent; background: transparent; padding: 6px 12px; }
  nav button[aria-current="page"] { background: var(--accent); color: var(--accent-text); }
  nav .badge { margin-left: 4px; }
  main { max-width: 800px; margin: 0 auto; padding: 24px 20px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 20px; }
  button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--line);
    background: var(--panel); border-radius: 10px; padding: 8px 14px; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible, .card:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  button.danger { color: var(--bad); }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .card { text-align: left; padding: 16px; border-radius: 14px; background: var(--panel);
    border: 1px solid var(--line); display: block; width: 100%; }
  .card .words { font-size: 20px; font-weight: 700; }
  .card .sounds { color: var(--muted); font-size: 14px; }
  .card .state { margin-top: 10px; font-size: 14px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px;
    background: var(--good-bg); color: var(--good); }
  .badge.due { background: var(--warn-bg); color: var(--warn); }
  .tip { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin: 16px 0; }
  .wordrow { display: flex; gap: 12px; flex-wrap: wrap; margin: 16px 0; }
  .wordrow button { flex: 1 1 200px; font-size: 26px; font-weight: 700; padding: 18px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
  .choices { display: flex; gap: 12px; flex-wrap: wrap; margin: 20px 0; }
  .choices button { flex: 1 1 200px; font-size: 28px; font-weight: 700; padding: 22px; }
  .choices button small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
  .listen { font-size: 40px; width: 96px; height: 96px; border-radius: 50%; padding: 0; }
  .dots { display: flex; gap: 6px; margin: 8px 0 4px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--dot); }
  .dot.ok { background: var(--good); } .dot.no { background: var(--bad); }
  .feedback { border-radius: 12px; padding: 12px 16px; margin: 12px 0; }
  .feedback.ok { background: var(--good-bg); color: var(--good); }
  .feedback.no { background: var(--bad-bg); color: var(--bad); }
  .feedback.warn { background: var(--warn-bg); color: var(--warn); }
  .muted { color: var(--muted); font-size: 14px; }
  .center { text-align: center; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; padding: 12px 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .item .text { flex: 1; }
  .item.click { cursor: pointer; text-align: left; width: 100%; }
  .sentence { font-size: 24px; line-height: 2.1; margin: 16px 0; }
  .chip { display: inline-block; padding: 0 8px; margin: 0 2px; border-radius: 8px; border: 1px solid transparent; font: inherit; background: transparent; cursor: default; }
  button.chip { cursor: pointer; }
  .chip.ok { background: var(--good-bg); color: var(--good); }
  .chip.doubt { background: var(--warn-bg); color: var(--warn); }
  .chip.wrong, .chip.missed { background: var(--bad-bg); color: var(--bad); }
  .chip.missed { text-decoration: line-through; }
  .chip.sel { border-color: var(--accent); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 12px 0; }
  .rec { background: var(--bad); color: #fff; border-color: var(--bad); }
  .pulse { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  .err { color: var(--bad); }
  input[type=text], textarea, select { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); width: 100%; }
  textarea { min-height: 200px; resize: vertical; }
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text); padding: 20px 22px;
    max-height: 86vh; overflow: auto; width: min(460px, 92vw); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h3 { margin: 18px 0 4px; font-size: 16px; }
  label { display: block; margin: 10px 0; }
  .vrow { display: flex; align-items: center; gap: 8px; margin: 2px 0; }
  .vrow label { margin: 0; flex: 1; }
  .vrow button { padding: 2px 10px; }

  .filebtn { display: inline-block; cursor: pointer; border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; background: var(--panel); margin: 0; }
  textarea.big { min-height: 58vh; font-size: 17px; line-height: 1.7; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .recbox { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; margin: 8px 0; }
  .meter { height: 16px; background: var(--dot); border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
  #test-bar { height: 100%; width: 0; background: var(--good); transition: width .06s linear; }
  #meter-bar { height: 100%; width: 0; background: var(--good); transition: width .06s linear; }
  #meter-bar.hot { background: var(--bad); }
  .live { margin-top: 6px; min-height: 1.6em; }
  .try { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 6px; }
  .try h3 { margin: 8px 0 4px; font-size: 17px; }
  .legend { margin: 2px 0 0; }
  .grid2 { display: flex; flex-wrap: wrap; gap: 6px 4px; margin: 6px 0 10px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 46px; padding: 6px 8px; border: 1px solid transparent; border-radius: 10px; background: transparent; }
  .col.sel { border-color: var(--accent); }
  .col .w { font-size: 20px; padding: 0 8px; border-radius: 8px; }
  .col .h { font-size: 15px; }
  .col .s { font-size: 12px; font-family: ui-monospace, "SF Mono", Menlo, monospace; white-space: nowrap; }
  .w.ok { background: var(--good-bg); color: var(--good); }
  .w.doubt { background: var(--warn-bg); color: var(--warn); }
  .w.wrong, .w.missed { background: var(--bad-bg); color: var(--bad); }
  .h.ok, .s.ok { color: var(--muted); }
  .h.doubt, .s.doubt { color: var(--warn); }
  .h.wrong, .h.missed, .s.wrong, .s.missed { color: var(--bad); font-weight: 600; }
  .pct { font-size: 22px; font-weight: 700; color: var(--accent); margin: 0 4px; }
  .pctbar { height: 8px; max-width: 360px; background: var(--dot); border-radius: 4px; overflow: hidden; margin: 2px 0 8px; }
  .pctbar i { display: block; height: 100%; background: var(--good); }
  tr.pctrow td { border-bottom: 2px solid var(--line); }
  table.cmp { border-collapse: collapse; margin: 8px 0; }
  table.cmp th, table.cmp td { padding: 4px 14px; text-align: center; border-bottom: 1px solid var(--line); }
  table.cmp td:first-child { text-align: left; }
  td.m.ok { color: var(--good); } td.m.doubt { color: var(--warn); } td.m.wrong, td.m.missed { color: var(--bad); }
  @media (max-width: 560px) { main { padding: 16px 16px 48px; } .sentence { font-size: 20px; } }
</style>
</head>
<body>
<header>
  <div class="brand">yourAccent</div>
  <nav id="tabs" aria-label="메뉴">
    <button data-tab="listen">듣기 훈련</button>
    <button data-tab="script">원고 연습</button>
    <button data-tab="review">복습<span class="badge due" id="due-badge" hidden></span></button>
  </nav>
  <div><button class="ghost" id="open-settings">설정</button></div>
</header>
<main id="view" aria-live="polite"></main>

<dialog id="settings">
  <h2 style="margin-top:0">설정</h2>
  <h3>퀴즈에 나오는 목소리</h3>
  <p class="muted" style="margin:0 0 8px">하나만 고르면 그 목소리만, 여러 개를 고르면 그중에서 무작위로 나옵니다. 🔈로 미리 들어 볼 수 있어요.</p>
  <div class="row"><button id="vo-all">모두 선택</button><button id="vo-ref">설명 목소리만</button></div>
  <div id="voice-list"></div>
  <h3>설명·비교 목소리</h3>
  <p class="muted" style="margin:0 0 8px">두 단어의 차이, 문장 읽어 주기, 정답 소리에 쓰는 목소리입니다.</p>
  <select id="ref" aria-label="설명 목소리"></select>
  <h3>속도</h3>
  <label><input type="checkbox" id="set-slow"> 천천히 듣기</label>
  <h3>마이크</h3>
  <p class="muted" style="margin:0 0 8px">읽을 때 쓸 마이크를 고르세요. 이름은 마이크를 한 번 허용한 뒤에 보여요.</p>
  <select id="set-mic" aria-label="마이크"></select>
  <div class="row"><button id="mic-test">마이크 소리 확인 (5초)</button></div>
  <div class="meter" id="test-meter" hidden><div id="test-bar"></div></div>
  <p class="muted" id="mic-info"></p>
  <h3>읽은 것을 판정하는 방식</h3>
  <p class="muted" style="margin:0 0 8px">메모리가 적은 Mac에서는 하나만 쓰면 더 빨라요.</p>
  <select id="set-engine" aria-label="판정 방식">
    <option value="both">소리 기준 + 단어 기준(Whisper) 둘 다</option>
    <option value="phoneme">소리 기준만 (빠름)</option>
    <option value="whisper">단어 기준(Whisper)만</option>
  </select>
  <div class="row"><button class="primary" id="close-settings">닫기</button></div>
</dialog>

<script>
"use strict";
const params = new URLSearchParams(location.search);
const MUTE = params.get("mute") === "1";       // for tests: no sound
let DATA = null;                                // pairs, voices, progress from the server
let SET = { voices: null, ref: null, slow: false, engine: "both", mic: null };
try { Object.assign(SET, JSON.parse(localStorage.getItem("youraccent-settings") || "{}")); } catch (e) {}
const $ = (id) => document.getElementById(id);
const view = $("view");
let TAB = "listen";
let audioEl = null;
let session = null;                             // the running listening quiz
let SP = null;                                  // the sentence being practised

// ---------------------------------------------------------------- basics
function allVoices() { return [...DATA.voices.british, ...DATA.voices.american_male]; }
function fixSettings() {                         // fill in defaults, drop voices that no longer exist
  const all = allVoices();
  SET.voices = Array.isArray(SET.voices) ? SET.voices.filter((v) => all.includes(v)) : all.slice();
  if (!SET.voices.length) SET.voices = all.slice();
  if (!all.includes(SET.ref)) SET.ref = DATA.voices.target;
  if (!["both", "phoneme", "whisper"].includes(SET.engine)) SET.engine = "both";
  if (typeof SET.mic !== "string") SET.mic = null;
}
function voiceLabel(v) {
  const kind = { bm: "영국 남", bf: "영국 여", am: "미국 남", af: "미국 여" }[v.slice(0, 2)] || "";
  const name = v.slice(3);
  return name.charAt(0).toUpperCase() + name.slice(1) + (kind ? ` (${kind})` : "");
}
function saveSettings() { try { localStorage.setItem("youraccent-settings", JSON.stringify(SET)); } catch (e) {} }
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

async function api(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  if (!res.ok) throw new Error((await res.text()) || res.status);
  return res.json();
}
function audioUrl(text, voice, speed) {
  const sp = speed || (SET.slow ? "slow" : "normal");
  const key = /^[A-Za-z']{1,24}$/.test(text) ? "word" : "text";
  return `/api/audio?${key}=${encodeURIComponent(text)}&voice=${encodeURIComponent(voice)}&speed=${sp}`;
}
function stopAudio() { if (audioEl) { audioEl.pause(); audioEl = null; } }
// Plays a sound file. Resolves when it has finished (or at once when muted or when it fails).
function playUrl(url) {
  return new Promise((resolve) => {
    if (MUTE) return setTimeout(resolve, 30);
    stopAudio();
    audioEl = new Audio(url);
    audioEl.onended = resolve;
    audioEl.onerror = () => { showError("소리를 만들지 못했습니다."); resolve(); };
    audioEl.play().catch(() => resolve());
  });
}
function play(text, voice, speed) { return playUrl(audioUrl(text, voice, speed)); }
function preload(text, voice) { if (!MUTE) { const a = new Audio(audioUrl(text, voice)); a.preload = "auto"; a.load(); } }
function showError(text) { const e = $("error"); if (e) e.textContent = text; }

function go(tab) {
  stopAudio(); stopRecordingQuietly();
  session = null; SP = null; TAB = tab;
  document.querySelectorAll("#tabs button").forEach((b) => { if (b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  if (tab === "listen") renderListenHome();
  else if (tab === "script") renderScriptHome();
  else renderReview();
}
document.querySelectorAll("#tabs button").forEach((b) => b.addEventListener("click", () => go(b.dataset.tab)));

async function refreshDue() {
  try {
    const r = await api("/api/review");
    const due = r.items.filter((i) => i.is_due).length;
    const badge = $("due-badge");
    badge.textContent = due; badge.hidden = due === 0;
    return r;
  } catch (e) { return null; }
}

// ================================================================ listening training
function progressOf(id) { return (DATA.progress[id]) || { trials: 0, correct: 0, recent: [], passed: false }; }

function renderListenHome() {
  session = null;
  const cards = DATA.pairs.map((p) => {
    const pr = progressOf(p.id);
    const state = pr.passed ? '<span class="badge">통과</span> ' : "";
    const stat = pr.trials ? `${state}${pr.trials}번 중 ${pr.correct}번 맞힘` : "아직 안 해 봤어요";
    return `<button class="card" data-pair="${p.id}"><div class="words">${esc(p.words[0])} / ${esc(p.words[1])}</div>
      <div class="sounds">${esc(p.sounds)}</div><div class="state muted">${stat}</div></button>`;
  }).join("");
  view.innerHTML = `<h1>어떤 소리를 연습할까요?</h1>
    <p class="lead">두 단어를 귀로 구분할 수 있을 때까지 반복합니다. 최근 10번 중 9번을 맞히면 통과입니다.</p>
    <div class="grid">${cards}</div>`;
  view.querySelectorAll(".card").forEach((b) => b.addEventListener("click", () => renderPair(b.dataset.pair)));
}

function renderPair(id) {
  const pair = DATA.pairs.find((p) => p.id === id);
  const target = SET.ref;
  const [a, b] = pair.words;
  view.innerHTML = `<button class="ghost" id="back">← 목록</button>
    <h1>${esc(a)} / ${esc(b)} <span class="muted">${esc(pair.sounds)}</span></h1>
    <div class="tip">${esc(pair.tip)}</div>
    <p class="muted">먼저 차이를 들어 보세요. (목소리: ${esc(voiceLabel(target))})</p>
    <div class="wordrow"><button id="w0">🔈 ${esc(a)}</button><button id="w1">🔈 ${esc(b)}</button></div>
    <div class="row"><button id="alt">번갈아 듣기</button><button class="primary" id="start">퀴즈 시작</button></div>
    <p class="err" id="error"></p>`;
  $("back").onclick = () => go("listen");
  $("w0").onclick = () => play(a, target);
  $("w1").onclick = () => play(b, target);
  $("alt").onclick = async () => { for (let i = 0; i < 2; i++) { await play(a, target); await wait(350); await play(b, target); await wait(500); } };
  $("start").onclick = () => startQuiz(pair);
  preload(a, target); preload(b, target);
}

function pickVoice() {                           // one chosen voice, or a random one of the chosen few
  return SET.voices[Math.floor(Math.random() * SET.voices.length)];
}
function pickWord(pair) {
  const conf = progressOf(pair.id).confusions || {};
  const [a, b] = pair.words;
  const wa = 1 + Math.min(3, conf[`${a}>${b}`] || 0);   // a word that was mistaken more often comes more often
  const wb = 1 + Math.min(3, conf[`${b}>${a}`] || 0);
  return Math.random() * (wa + wb) < wa ? a : b;
}
function makeTrial(pair) { return { word: pickWord(pair), voice: pickVoice() }; }

function startQuiz(pair) {
  session = { pair, trial: makeTrial(pair), answered: false, busy: false };
  renderQuiz();
  playTrial();
}

function dots(pr) {
  const items = [];
  for (let i = 0; i < 10; i++) {
    const v = pr.recent[i];
    items.push(`<span class="dot ${v === 1 ? "ok" : v === 0 ? "no" : ""}"></span>`);
  }
  return items.join("");
}

function renderQuiz(feedback) {
  const { pair, trial } = session;
  const pr = progressOf(pair.id);
  const [a, b] = pair.words;
  const choices = session.answered
    ? ""
    : `<div class="choices"><button data-w="${esc(a)}">${esc(a)}<small>키 1</small></button><button data-w="${esc(b)}">${esc(b)}<small>키 2</small></button></div>`;
  view.innerHTML = `<button class="ghost" id="back">← 목록</button>
    <h1>${esc(a)} / ${esc(b)} <span class="muted">듣기 퀴즈</span></h1>
    <div class="center"><button class="listen" id="again" title="다시 듣기 (스페이스)" aria-label="다시 듣기">🔈</button>
    <p class="muted">${session.answered ? "" : "들려주는 단어를 고르세요. 스페이스로 다시 들을 수 있어요."}</p></div>
    ${choices}
    ${feedback || ""}
    <div class="muted">최근 10번 (${pr.recent.reduce((s, x) => s + x, 0)}번 맞힘, 9번이면 통과)</div>
    <div class="dots">${dots(pr)}</div>
    <p class="err" id="error"></p>`;
  $("back").onclick = () => go("listen");
  $("again").onclick = () => play(trial.word, trial.voice);
  view.querySelectorAll(".choices button").forEach((btn) => btn.addEventListener("click", () => answer(btn.dataset.w)));
  const next = $("next"); if (next) next.onclick = nextTrial;
  const cmp = $("compare"); if (cmp) cmp.onclick = compare;
  const more = $("keep"); if (more) more.onclick = nextTrial;
  const done = $("done"); if (done) done.onclick = () => go("listen");
}

async function playTrial() { await play(session.trial.word, session.trial.voice); }

async function answer(chosen) {
  if (!session || session.answered || session.busy) return;
  session.busy = true;
  const { pair, trial } = session;
  let result;
  try {
    result = await api("/api/answer", { pair: pair.id, played: trial.word, chosen, voice: trial.voice });
  } catch (e) { session.busy = false; return showError("기록하지 못했습니다."); }
  DATA.progress[pair.id] = result;
  session.answered = true; session.busy = false;
  const right = chosen === trial.word;
  let fb = right
    ? `<div class="feedback ok">맞았어요! 들려준 단어는 <b>${esc(trial.word)}</b>입니다. <span class="muted">(${esc(voiceLabel(trial.voice))})</span></div>`
    : `<div class="feedback no">아쉬워요. 들려준 단어는 <b>${esc(trial.word)}</b>였어요. <span class="muted">(${esc(voiceLabel(trial.voice))})</span></div>`;
  if (result.just_passed) {
    fb += `<div class="feedback ok"><b>통과!</b> 최근 10번 중 9번 이상 맞혔어요. 계속 연습하거나 다른 소리로 넘어가세요.</div>
      <div class="row"><button class="primary" id="keep">계속 연습</button><button id="done">다른 소리 고르기</button></div>`;
  } else {
    fb += `<div class="row"><button id="compare">두 단어 비교해서 듣기</button><button class="primary" id="next">다음 (Enter)</button></div>`;
  }
  renderQuiz(fb);
  if (!right) compare();
}

async function compare() {
  if (!session) return;
  const [a, b] = session.pair.words, v = SET.ref;
  await play(a, v); await wait(300); await play(b, v);
}

function nextTrial() {
  session.trial = makeTrial(session.pair);
  session.answered = false;
  renderQuiz();
  preload(session.trial.word, session.trial.voice);
  playTrial();
}

// ---------------------------------------------------------------- recording in the browser
const Rec = { stream: null, ctx: null, node: null, chunks: [], active: false, level: 0, max: 0, t0: 0, peeking: false, label: "" };
// Virtual microphones carry no voice of their own (BlackHole 16ch is silent unless secondchair is running).
const VIRTUAL_MIC = /blackhole|aggregate|virtual|teams audio|zoom|camo|loopback|soundflower|multi-output/i;
async function openAudio(deviceId) {                    // the chosen microphone, or else a real one
  const base = { echoCancellation: false, noiseSuppression: false };
  const ask = (extra) => navigator.mediaDevices.getUserMedia({ audio: { ...base, ...extra } });
  if (deviceId) {
    try { return await ask({ deviceId: { exact: deviceId } }); }
    catch (e) { /* that microphone is not there any more: use the default */ }
  }
  const stream = await ask({});
  if (VIRTUAL_MIC.test((stream.getAudioTracks()[0] || {}).label || "")) {   // the browser picked a virtual one
    try {
      const real = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "audioinput" && d.label
        && d.deviceId !== "default" && d.deviceId !== "communications" && !VIRTUAL_MIC.test(d.label));
      const better = real.find((d) => /macbook|built-in|내장/i.test(d.label)) || real[0];
      if (better) { const again = await ask({ deviceId: { exact: better.deviceId } }); stream.getTracks().forEach((t) => t.stop()); return again; }
    } catch (e) { /* keep the first one */ }
  }
  return stream;
}
async function startRecording() {
  Rec.stream = await openAudio(SET.mic);
  Rec.label = (Rec.stream.getAudioTracks()[0] || {}).label || "";
  Rec.ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (Rec.ctx.state !== "running") await Rec.ctx.resume();   // a browser may start it stopped, and then no sound arrives
  const source = Rec.ctx.createMediaStreamSource(Rec.stream);
  Rec.node = Rec.ctx.createScriptProcessor(4096, 1, 1);   // writes nothing to its output: silent
  Rec.chunks = []; Rec.level = 0; Rec.max = 0; Rec.t0 = performance.now(); Rec.peeking = false;
  Rec.node.onaudioprocess = (e) => {
    const data = new Float32Array(e.inputBuffer.getChannelData(0));
    Rec.chunks.push(data);
    let sum = 0; for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
    const rms = Math.sqrt(sum / data.length);
    Rec.level = Math.max(rms, Rec.level * 0.8); Rec.max = Math.max(Rec.max, rms);
  };
  source.connect(Rec.node); Rec.node.connect(Rec.ctx.destination);
  Rec.active = true;
  meterLoop(); peekLoop();
}
function stopRecordingQuietly() {
  if (!Rec.active) return;
  Rec.active = false;
  try { Rec.node.disconnect(); Rec.stream.getTracks().forEach((t) => t.stop()); Rec.ctx.close(); } catch (e) {}
}
function finishRecording() {
  const rate = Rec.ctx.sampleRate, chunks = Rec.chunks;
  stopRecordingQuietly();
  return encodeWav(chunks, rate);
}
function meterLoop() {                                   // the level bar, the timer and the "no sound" hint
  if (!Rec.active) return;
  const bar = $("meter-bar");
  if (bar) {
    const db = 20 * Math.log10(Math.max(Rec.level, 1e-5));
    const pct = Math.max(0, Math.min(100, ((db + 55) / 55) * 100));
    bar.style.width = pct + "%"; bar.classList.toggle("hot", pct > 92);
  }
  const secs = (performance.now() - Rec.t0) / 1000;
  const timer = $("rec-time"); if (timer) timer.textContent = Math.floor(secs / 60) + ":" + String(Math.floor(secs % 60)).padStart(2, "0");
  const hint = $("mic-hint");
  if (hint) {
    const dead = secs > 1.5 && Rec.chunks.length === 0;           // the browser delivers no sound at all
    hint.hidden = !(dead || (secs > 3 && Rec.max < 0.01));
    hint.textContent = dead
      ? "마이크 소리가 아예 들어오지 않아요. 주소창 왼쪽의 마이크 허용을 확인하고, macOS 시스템 설정 > 개인정보 보호 및 보안 > 마이크에서 이 브라우저가 켜져 있는지 확인하세요."
      : "소리가 작아요. 마이크에 가까이서 말하거나, 설정에서 다른 마이크를 골라 보세요.";
  }
  requestAnimationFrame(meterLoop);
}
async function peekOnce() {                              // what Whisper hears so far, shown while reading
  if (!Rec.active || Rec.peeking || !SP) return;
  Rec.peeking = true;
  try {
    const blob = encodeWav(Rec.chunks.slice(), Rec.ctx.sampleRate);
    const res = await fetch("/api/peek", { method: "POST", headers: { "Content-Type": "audio/wav" }, body: blob });
    if (res.ok && Rec.active && SP) { SP.live = (await res.json()).text; const el = $("live-text"); if (el) el.textContent = SP.live; }
  } catch (e) {}
  Rec.peeking = false;
}
async function peekLoop() { while (Rec.active) { await wait(2500); await peekOnce(); } }
function encodeWav(chunks, rate) {                       // 16-bit mono wav
  let n = 0; for (const c of chunks) n += c.length;
  const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, s) => [...s].forEach((ch, i) => v.setUint8(o + i, ch.charCodeAt(0)));
  w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt "); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, n * 2, true);
  let o = 44;
  for (const c of chunks) for (let i = 0; i < c.length; i++) { const s = Math.max(-1, Math.min(1, c[i])); v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true); o += 2; }
  return new Blob([buf], { type: "audio/wav" });
}

// ---------------------------------------------------------------- one sentence, tried again and again
const STATUS_TEXT = { ok: "잘 들렸어요", doubt: "애매해요", wrong: "다르게 들렸어요", missed: "들리지 않았어요" };
const SYMBOL = { ok: "✓", doubt: "?", wrong: "✗", missed: "–" };

function openSentence(list, idx, back) {
  SP = { list, idx, back, tries: [], selected: null, busy: false, recording: false, status: "", live: "" };
  renderSentence();
}
function primaryOf(data) { return data.engines[data.primary]; }
function counts(data) {
  const e = primaryOf(data);
  return { bad: e.rows.filter((r) => r.status === "wrong" || r.status === "missed").length,
           unsure: e.rows.filter((r) => r.status === "doubt").length, incomplete: e.incomplete };
}

// How much of the sentence came out as written: ok counts 1, doubt counts half. Not for a reading that did not cover it.
function matchPct(data) {
  const e = primaryOf(data);
  if (e.incomplete || !e.rows.length) return null;
  const score = e.rows.reduce((sum, r) => sum + (r.status === "ok" ? 1 : r.status === "doubt" ? 0.5 : 0), 0);
  return Math.round((100 * score) / e.rows.length);
}

// The script and what was heard, word by word, one above the other.
function gridHtml(t, ti) {
  const d = t.data, ph = d.engines.phoneme, wh = d.engines.whisper;
  return '<div class="grid2">' + (ph || wh).rows.map((r, i) => {
    const rp = ph && ph.rows[i], rw = wh && wh.rows[i], main = rp || rw;
    const sel = SP.selected && SP.selected.t === ti && SP.selected.i === i;
    const heard = rw ? (rw.status === "missed" ? "—" : rw.heard_as) : "";
    return `<button class="col ${sel ? "sel" : ""}" data-t="${ti}" data-i="${i}" aria-label="${esc(r.word)}: ${STATUS_TEXT[main.status]}">
      <span class="w ${main.status}">${esc(r.word)}</span>
      ${rw ? `<span class="h ${rw.status}">${esc(heard)}</span>` : ""}</button>`;
  }).join("") + "</div>";
}

function tryHtml(t, ti) {
  const d = t.data, c = counts(d), wh = d.engines.whisper;
  const prev = SP.tries.slice(0, ti).reverse().find((x) => !counts(x.data).incomplete);
  const pct = matchPct(d), prevPct = prev ? matchPct(prev.data) : null;
  let delta = "";
  if (pct !== null && prevPct !== null) {
    const diff = pct - prevPct;
    delta = diff > 0 ? `<span class="badge">↑ ${diff}%p 좋아졌어요</span>` : diff < 0 ? `<span class="badge due">↓ ${-diff}%p 낮아졌어요</span>` : '<span class="badge due">변화 없음</span>';
  }
  const head = c.incomplete ? "끝까지 읽지 않은 것 같아요 (복습에 저장 안 함)"
    : (c.bad ? `틀린 단어 ${c.bad}개` : "틀린 단어 없음") + (c.unsure ? ` · 애매 ${c.unsure}개` : "");
  const errs = Object.keys(d.errors || {}).map((n) => `<div class="feedback warn">${esc(n === "phoneme" ? "소리 기준" : "단어 기준")} 판정을 쓰지 못했어요.</div>`).join("");
  const legend = wh ? "위: 원고 · 아래: 들린 말(Whisper) · 단어를 누르면 자세한 분석이 나와요" : "단어를 누르면 자세한 분석이 나와요";
  return `<section class="try" data-try="${ti}"><h3>시도 ${t.n} ${pct !== null ? `<span class="pct">${pct}%</span>` : ""} <span class="muted">· ${head}</span> ${delta}</h3>
    ${pct !== null ? `<div class="pctbar" role="img" aria-label="일치율 ${pct}%"><i style="width:${pct}%"></i></div>` : ""}
    ${errs}${d.quiet ? `<div class="feedback warn">소리가 아주 작게 들어갔어요 (가장 큰 소리 ${d.peak}, 보통 말소리는 0.1 안팎). 마이크에 더 가까이서 읽거나, 설정에서 마이크를 확인하세요.</div>` : ""}
    <div class="legend muted">${legend}</div>
    ${gridHtml(t, ti)}
    ${wh ? `<div class="muted">Whisper가 들은 문장: “${esc(wh.heard || "아무것도 안 들림")}”</div>` : ""}
    <div data-detail="${ti}"></div></section>`;
}

// What I know now: which words got better over the tries, which are still hard.
function compareHtml() {
  const done = SP.tries.filter((t) => !counts(t.data).incomplete);
  if (done.length < 2) return "";
  const rowsOf = (t) => primaryOf(t.data).rows, n = rowsOf(done[0]).length;
  const bad = (r) => r.status === "wrong" || r.status === "missed";
  const words = [];
  for (let i = 0; i < n; i++) {
    const marks = done.map((t) => rowsOf(t)[i]);
    if (marks.some(bad)) words.push({ word: marks[0].word, marks });
  }
  const last = (w) => w.marks[w.marks.length - 1];
  const better = words.filter((w) => !bad(last(w))).map((w) => w.word), hard = words.filter((w) => bad(last(w))).map((w) => w.word);
  const head = done.map((t) => `<th>시도 ${t.n}</th>`).join("");
  const pctRow = `<tr class="pctrow"><td><b>일치율</b></td>${done.map((t) => `<td><b>${matchPct(t.data)}%</b></td>`).join("")}</tr>`;
  const trend = done.map((t) => matchPct(t.data) + "%").join(" → ");
  const body = pctRow + words.map((w) => `<tr><td><b>${esc(w.word)}</b></td>${w.marks.map((r) => `<td class="m ${r.status}" title="${STATUS_TEXT[r.status]}">${SYMBOL[r.status]}</td>`).join("")}</tr>`).join("");
  return `<details class="panel" open><summary style="cursor:pointer"><b>내가 아는 것</b> <span class="muted">(시도 ${done.length}번 비교)</span></summary>
    ${better.length ? `<div class="feedback ok">좋아진 단어: <b>${esc(better.join(", "))}</b></div>` : ""}
    ${hard.length ? `<div class="feedback no">아직 어려운 단어: <b>${esc(hard.join(", "))}</b></div>` : '<div class="feedback ok">마지막 시도에는 틀린 단어가 없어요.</div>'}
    <div class="muted">일치율 변화: <b>${trend}</b></div>
    <table class="cmp"><thead><tr><th></th>${head}</tr></thead><tbody>${body}</tbody></table>
    <div class="muted">✓ 잘 읽음 · ? 애매 · ✗ 틀림 · – 안 들림 (일치율: 잘 읽은 단어 1, 애매한 단어 0.5로 센 비율)</div></details>`;
}

function newestFirst() {                                 // newest try, then the summary, then older tries (newest first)
  const order = SP.tries.map((t, ti) => ti).reverse();
  if (!order.length) return "";
  return tryHtml(SP.tries[order[0]], order[0]) + compareHtml() + order.slice(1).map((ti) => tryHtml(SP.tries[ti], ti)).join("");
}

// Practising one word: read it again and again, each reading judged; three in a row passes.
function openDrill(word, ph, ti, i) {
  const inPair = DATA.pairs.find((p) => p.words.includes(word.toLowerCase()));
  // The word is practised with one word on each side, as it is in the sentence: a word read alone is judged much less reliably.
  const words = primaryOf(SP.tries[ti].data).rows.map((r) => r.word), from = Math.max(0, i - 1), to = Math.min(words.length, i + 2);
  SP.drill = { word, phrase: words.slice(from, to).join(" "), target: i - from, expected: ph ? ph.expected : "", note: ph ? ph.note : "",
               tip: inPair ? inPair.tip : "", tries: [], busy: false, status: "" };
  renderSentence();
  const el = $("drill"); if (el && !MUTE) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function drillStreak(d) { let n = 0; for (let k = d.tries.length - 1; k >= 0 && d.tries[k].ok; k--) n++; return n; }
function drillHtml() {
  const d = SP.drill;
  if (!d) return "";
  const streak = drillStreak(d), passed = streak >= 3, mine = SP.recording && SP.recMode === "drill";
  const list = d.tries.slice().reverse().map((t) => `<div class="item"><div class="text">${t.ok ? "✓" : "✗"} <b>${esc(t.msg)}</b>
      ${t.heard ? `<div class="muted">들린 말(Whisper): ${esc(t.heard)}</div>` : ""}</div>
      <button class="ghost" data-dmine="${t.n}" ${t.hasClip ? "" : "disabled"}>▶ 내 소리</button></div>`).join("");
  const phraseHtml = d.phrase.split(" ").map((w, k) => k === d.target ? `<b>${esc(w)}</b>` : esc(w)).join(" ");
  return `<div class="panel" id="drill"><div class="row" style="margin:0 0 4px;justify-content:space-between">
      <div><b style="font-size:22px">${esc(d.word)}</b> <span class="muted">단어 연습</span></div><button class="ghost" id="drill-close">닫기</button></div>
    <div style="font-size:20px;margin:2px 0 6px">읽을 말: ${phraseHtml}</div>
    <div class="muted" style="line-height:1.8">${d.expected ? `정답 소리: <span class="mono">${esc(d.expected)}</span><br>` : ""}${esc(d.tip || "")}</div>
    <div class="row">
      <button id="drill-right" ${mine ? "disabled" : ""}>▶ 정답 소리</button><button id="drill-word" ${mine ? "disabled" : ""}>▶ 단어만</button><button id="drill-slow" ${mine ? "disabled" : ""}>🐢 천천히</button>
      <button id="drill-rec" class="${mine ? "rec pulse" : "primary"}" ${d.busy || (SP.recording && !mine) ? "disabled" : ""}>${mine ? "■ 끝내기" : d.tries.length ? "🎙 다시 해 보기" : "🎙 따라 해 보기"}</button>
    </div>
    <p class="muted" style="margin:4px 0">${esc(d.status)}</p>
    <div class="feedback ${passed ? "ok" : "warn"}">${passed ? "통과! 연속 3번 맞게 읽었어요. 이제 문장에서 다시 읽어 보세요." : `연속 ${streak}번 성공 (3번 연속이면 통과)`}</div>
    <div class="list">${list}</div></div>`;
}
function bindDrill() {
  const d = SP.drill;
  if (!d) return;
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on("drill-right", () => play(d.phrase, SET.ref));
  on("drill-word", () => play(d.word, SET.ref));
  on("drill-slow", () => play(d.phrase, SET.ref, "slow"));
  on("drill-rec", toggleDrill);
  on("drill-close", () => {
    if (SP.recording && SP.recMode === "drill") { stopRecordingQuietly(); SP.recording = false; SP.recMode = null; }
    SP.drill = null; renderSentence();
  });
  view.querySelectorAll("[data-dmine]").forEach((b) => b.addEventListener("click", () => {
    const t = d.tries[+b.dataset.dmine - 1];
    if (t && t.hasClip) playUrl(`/api/clip?attempt=${t.attempt}&i=${d.target}&engine=${t.engine}`);
  }));
}
async function toggleDrill() {
  const d = SP.drill;
  if (!d || d.busy) return;
  if (!(SP.recording && SP.recMode === "drill")) {
    if (SP.recording) return;
    stopAudio();
    try { await startRecording(); } catch (e) { d.status = "마이크를 쓸 수 없어요. 브라우저 주소창의 마이크 허용을 확인하세요."; return renderSentence(); }
    SP.recording = true; SP.recMode = "drill"; SP.live = ""; d.status = ""; return renderSentence();
  }
  SP.recording = false; SP.recMode = null;
  const silent = Rec.max < 0.0015, label = Rec.label;
  const blob = finishRecording();
  if (silent) { d.status = `소리가 전혀 들어오지 않았어요 (마이크: ${label || "알 수 없음"}).`; return renderSentence(); }
  await submitDrill(blob);
}
async function submitDrill(blob) {                       // a word read on its own; it does not touch the review list
  const d = SP.drill;
  d.busy = true; d.status = "분석 중…"; renderSentence();
  try {
    const res = await fetch(`/api/judge?engine=${SET.engine}&drill=1&text=${encodeURIComponent(d.phrase)}`, { method: "POST", headers: { "Content-Type": "audio/wav" }, body: blob });
    const data = await res.json();
    if (!res.ok) { d.busy = false; d.status = data.error === "too_short" ? "너무 짧아요. 또렷하게 읽어 주세요." : "분석하지 못했습니다. 다시 해 보세요."; return renderSentence(); }
    const e = primaryOf(data), row = e.rows[d.target], wh = data.engines.whisper && data.engines.whisper.rows[d.target];
    if (e.incomplete) { d.busy = false; d.status = "소리가 잘 안 들어갔어요. 다시 해 보세요."; return renderSentence(); }
    // Success: the sounds were as expected. A word with only a vowel off counts too (the practice is about the consonants).
    const ok = row.status === "ok" || row.status === "doubt";
    const msg = row.status === "ok" ? "맞았어요" : row.status === "doubt" ? "거의 맞았어요 (모음은 조금 달랐을 수 있어요)"
      : (row.note || (row.status === "missed" ? "들리지 않았어요" : `「${row.heard_as}」로 들렸어요`));
    d.tries.push({ n: d.tries.length + 1, ok, msg, heard: wh ? (wh.status === "missed" ? "—" : wh.heard_as) : "", attempt: data.attempt, engine: data.primary, hasClip: row.has_clip });
    d.busy = false; d.status = "";
    renderSentence();
  } catch (err) { d.busy = false; d.status = "분석하지 못했습니다. 프로그램이 켜져 있는지 확인하세요."; renderSentence(); }
}

function renderSentence() {
  const text = SP.list[SP.idx], multi = SP.list.length > 1, nextTry = SP.tries.length + 1;
  const sentRec = SP.recording && SP.recMode !== "drill";        // recording the whole sentence (not a single word)
  const recArea = SP.recording ? `<div class="recbox">
      <div class="meter" role="img" aria-label="마이크 소리 크기"><div id="meter-bar"></div></div>
      <div class="muted"><span class="pulse">● 녹음 중</span> <span id="rec-time">0:00</span> · 막대가 움직이면 소리가 들어가고 있어요</div>
      <div class="muted">마이크: <b>${esc(Rec.label || "알 수 없음")}</b></div>
      <div class="live">듣는 중: <b id="live-text">${esc(SP.live || "")}</b></div>
      <div class="feedback warn" id="mic-hint" hidden>소리가 작아요. 마이크에 가까이서 말하거나, 설정에서 다른 마이크를 골라 보세요.</div></div>` : "";
  view.innerHTML = `<button class="ghost" id="back">← 뒤로</button>
    ${multi ? `<div class="muted">${SP.idx + 1} / ${SP.list.length}</div>` : ""}
    <div class="sentence" id="sentence">${esc(text)}</div>
    <div class="row">
      <button id="listen" ${SP.recording ? "disabled" : ""}>🔈 듣기</button><button id="slow" ${SP.recording ? "disabled" : ""}>🐢 천천히</button>
      <button id="rec" class="${sentRec ? "rec pulse" : "primary"}" ${SP.busy || (SP.recording && !sentRec) ? "disabled" : ""}>${sentRec ? "■ 끝내기" : SP.tries.length ? `🎙 다시 읽기 (시도 ${nextTry})` : "🎙 읽기"}</button>
    </div>
    ${recArea}
    ${drillHtml()}
    <p class="muted" id="status">${esc(SP.status)}</p>
    ${newestFirst()}
    <div class="row">
      <button id="save-sentence">문장 저장</button>
      ${multi ? `<button id="prev" ${SP.idx === 0 ? "disabled" : ""}>← 이전 문장</button><button id="next" ${SP.idx === SP.list.length - 1 ? "disabled" : ""}>다음 문장 →</button>` : ""}
    </div>
    <p class="err" id="error"></p>`;
  $("back").onclick = () => { stopAudio(); stopRecordingQuietly(); SP.back(); };
  $("listen").onclick = () => play(text, SET.ref);
  $("slow").onclick = () => play(text, SET.ref, "slow");
  $("rec").onclick = toggleRecording;
  view.querySelectorAll(".col[data-i]").forEach((c) => c.addEventListener("click", () => { SP.selected = { t: +c.dataset.t, i: +c.dataset.i }; renderSentence(); }));
  $("save-sentence").onclick = async () => { await api("/api/review/save", { kind: "sentence", text }); SP.status = "문장을 복습에 저장했어요."; $("status").textContent = SP.status; refreshDue(); };
  const prev = $("prev"); if (prev) prev.onclick = () => openSentence(SP.list, SP.idx - 1, SP.back);
  const next = $("next"); if (next) next.onclick = () => openSentence(SP.list, SP.idx + 1, SP.back);
  renderDetail();
  bindDrill();
  if (SP.preload !== text) { SP.preload = text; preload(text, SET.ref); }
}

function renderDetail() {
  if (!SP.selected) return;
  const { t: ti, i } = SP.selected, t = SP.tries[ti], host = view.querySelector(`[data-detail="${ti}"]`);
  if (!t || !host) return;
  const d = t.data, ph = d.engines.phoneme && d.engines.phoneme.rows[i], wh = d.engines.whisper && d.engines.whisper.rows[i], r = ph || wh;
  const lines = [];
  if (wh) lines.push(`들린 말(Whisper): <b>${esc(wh.status === "missed" ? "—" : wh.heard_as)}</b> <span class="muted">(${STATUS_TEXT[wh.status]})</span>`);
  if (ph) lines.push(`소리 기준: <span class="mono">${esc(ph.expected)}</span> → <span class="mono">${esc(ph.heard_as || "—")}</span> <span class="muted">(${STATUS_TEXT[ph.status]})</span>${ph.note ? ` · <b>${esc(ph.note)}</b>` : ""}`);
  const clipEngine = ph && ph.has_clip ? "phoneme" : wh && wh.has_clip ? "whisper" : null;
  const inPair = DATA.pairs.find((p) => p.words.includes(r.word.toLowerCase()));
  host.innerHTML = `<div class="panel"><div><b style="font-size:20px">${esc(r.word)}</b></div>
    <div class="muted" style="line-height:1.9">${lines.join("<br>")}</div>
    <div class="row">
      <button data-a="right">▶ 정답 소리</button>
      <button data-a="mine" ${clipEngine ? "" : "disabled"}>▶ 내 소리</button>
      <button data-a="both" ${clipEngine ? "" : "disabled"}>번갈아 듣기</button>
      <button data-a="drill" class="primary">🎙 이 단어 연습하기</button>
      <button data-a="save">복습에 저장</button>
      ${inPair ? '<button data-a="pair">이 소리 듣기 훈련</button>' : ""}
    </div></div>`;
  const mine = () => playUrl(`/api/clip?attempt=${d.attempt}&i=${i}&engine=${clipEngine}`);
  const act = {
    right: () => play(r.word, SET.ref),
    mine,
    both: async () => { for (let k = 0; k < 2; k++) { await play(r.word, SET.ref); await wait(300); await mine(); await wait(400); } },
    save: async () => { await api("/api/review/save", { kind: "word", text: r.word }); $("status").textContent = `“${r.word}”을(를) 복습에 저장했어요.`; refreshDue(); },
    pair: () => { go("listen"); renderPair(inPair.id); },
    drill: () => openDrill(r.word, ph, ti, i),
  };
  host.querySelectorAll("[data-a]").forEach((b) => b.addEventListener("click", act[b.dataset.a]));
}

async function toggleRecording() {
  if (!SP || SP.busy) return;
  if (!SP.recording) {
    stopAudio();
    try { await startRecording(); } catch (e) {
      SP.status = "마이크를 쓸 수 없어요. 브라우저 주소창의 마이크 허용을 확인하세요."; return renderSentence();
    }
    SP.recording = true; SP.recMode = "sentence"; SP.live = ""; SP.status = ""; return renderSentence();
  }
  SP.recording = false; SP.recMode = null;
  const silent = Rec.max < 0.0015, label = Rec.label;      // read before the recorder is reset
  const blob = finishRecording();
  if (silent) {
    SP.status = `소리가 전혀 들어오지 않았어요 (마이크: ${label || "알 수 없음"}). 설정에서 ‘마이크 소리 확인’으로 먼저 확인해 보세요.`;
    return renderSentence();
  }
  await submitRecording(blob);
}

// Sends a recording (a wav blob) to be judged. The recording button calls this; so can tests.
async function submitRecording(blob) {
  SP.recording = false; SP.busy = true; SP.status = "분석 중… (처음에는 모델을 불러오느라 몇 초 더 걸릴 수 있어요)"; renderSentence();
  const text = SP.list[SP.idx];
  try {
    const res = await fetch("/api/judge?engine=" + SET.engine + "&text=" + encodeURIComponent(text), { method: "POST", headers: { "Content-Type": "audio/wav" }, body: blob });
    const data = await res.json();
    if (!res.ok) {
      SP.busy = false; SP.status = data.error === "too_short" ? "너무 짧아요. 문장을 끝까지 읽어 주세요." : "분석하지 못했습니다. 다시 읽어 보세요.";
      return renderSentence();
    }
    SP.tries.push({ n: SP.tries.length + 1, data });
    const first = primaryOf(data).rows.find((r) => r.status === "wrong" || r.status === "missed") || primaryOf(data).rows.find((r) => r.status !== "ok");
    SP.selected = first ? { t: SP.tries.length - 1, i: first.i } : null;
    SP.busy = false; SP.status = ""; SP.live = "";
    renderSentence();
    if (!MUTE) window.scrollTo({ top: 0, behavior: "smooth" });
    refreshDue();
  } catch (e) { SP.busy = false; SP.status = "분석하지 못했습니다. 프로그램이 켜져 있는지 확인하세요."; renderSentence(); }
}

// ================================================================ review
async function renderReview() {
  view.innerHTML = '<p class="muted">불러오는 중…</p>';
  const r = await refreshDue();
  if (TAB !== "review") return;
  if (!r) { view.innerHTML = '<p class="err">복습 목록을 불러오지 못했습니다.</p>'; return; }
  const due = r.items.filter((i) => i.is_due), later = r.items.filter((i) => !i.is_due);
  const card = (i) => {
    const label = i.kind === "word" ? `<b style="font-size:18px">${esc(i.text)}</b>${i.heard_as ? ` <span class="muted">「${esc(i.heard_as)}」로 들림</span>` : ""}` : `<span>${esc(i.text)}</span>`;
    const ex = i.kind === "word" && i.examples.length ? `<div class="muted">${esc(i.examples[i.examples.length - 1])}</div>` : "";
    const info = `<div class="muted">${i.kind === "word" ? `틀린 횟수 ${i.misses}번 · 연속 성공 ${i.streak}번` : "저장한 문장"}${i.is_due ? "" : ` · 다음 복습 ${esc(i.due)}`}</div>`;
    return `<div class="item"><div class="text">${label}${ex}${info}</div>
      <div class="row" style="margin:0"><button class="primary" data-practice="${esc(i.id)}">연습</button>
      <button class="ghost danger" data-remove="${esc(i.id)}" aria-label="${esc(i.text)} 지우기">지우기</button></div></div>`;
  };
  view.innerHTML = `<h1>복습</h1>
    <p class="lead">틀린 단어와 저장한 문장이 여기로 돌아와요. 세 번 연속 맞게 읽으면 목록에서 빠집니다. (졸업한 항목 ${r.graduated}개)</p>
    <h2 style="font-size:18px;margin:0 0 8px">오늘 복습할 것 <span class="badge due">${due.length}</span></h2>
    <div class="list">${due.map(card).join("") || '<p class="muted">오늘 복습할 것이 없어요.</p>'}</div>
    ${later.length ? `<h2 style="font-size:18px;margin:24px 0 8px">나중에 복습할 것</h2><div class="list">${later.map(card).join("")}</div>` : ""}`;
  const byId = Object.fromEntries(r.items.map((i) => [i.id, i]));
  view.querySelectorAll("[data-practice]").forEach((b) => b.addEventListener("click", () => {
    const i = byId[b.dataset.practice];
    const sentences = i.kind === "sentence" ? [i.text] : (i.examples.length ? i.examples.slice().reverse() : [i.text]);
    openSentence(sentences, 0, () => go("review"));
  }));
  view.querySelectorAll("[data-remove]").forEach((b) => b.addEventListener("click", async () => {
    await api("/api/review/delete", { id: b.dataset.remove }); renderReview();
  }));
}

// ================================================================ keys and settings
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (!session || TAB !== "listen" || (t.closest && t.closest("dialog")) || e.metaKey || e.ctrlKey || e.altKey) return;
  const onButton = t.tagName === "BUTTON";
  const [a, b] = session.pair.words;
  if (!session.answered) {
    if (e.key === "1") answer(a);
    else if (e.key === "2") answer(b);
    else if (e.key === " " && !onButton) { e.preventDefault(); play(session.trial.word, session.trial.voice); }
  } else if (e.key === "Enter" && !$("done") && !onButton) {
    nextTrial();
  }
});

function renderSettings() {
  const row = (v) => `<div class="vrow"><label><input type="checkbox" data-voice="${v}" ${SET.voices.includes(v) ? "checked" : ""}> ${esc(voiceLabel(v))}</label>
    <button data-hear="${v}" title="미리 듣기" aria-label="${esc(voiceLabel(v))} 미리 듣기">🔈</button></div>`;
  $("voice-list").innerHTML = allVoices().map(row).join("");
  $("ref").innerHTML = allVoices().map((v) => `<option value="${v}" ${v === SET.ref ? "selected" : ""}>${esc(voiceLabel(v))}</option>`).join("");
  $("set-slow").checked = SET.slow;
  $("set-engine").value = SET.engine;
  $("voice-list").querySelectorAll("input[data-voice]").forEach((box) => box.addEventListener("change", () => {
    const v = box.dataset.voice;
    if (box.checked) SET.voices.push(v);
    else if (SET.voices.length > 1) SET.voices = SET.voices.filter((x) => x !== v);
    else box.checked = true;                      // at least one voice stays chosen
    saveSettings();
  }));
  $("voice-list").querySelectorAll("button[data-hear]").forEach((btn) => btn.addEventListener("click", () => play("right", btn.dataset.hear)));
}
async function renderMics() {
  let devices = [];
  try { devices = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "audioinput" && d.deviceId !== "default" && d.deviceId !== "communications"); } catch (e) {}
  const named = devices.some((d) => d.label);
  $("set-mic").innerHTML = '<option value="">기본 (시스템 설정을 따름)</option>' +
    devices.map((d, k) => `<option value="${esc(d.deviceId)}" ${d.deviceId === SET.mic ? "selected" : ""}>${esc(d.label || `마이크 ${k + 1}`)}</option>`).join("") +
    (named ? "" : '<option value="" disabled>(마이크를 한 번 허용하면 이름이 보여요)</option>');
}
async function micTest() {                              // 5 seconds: shows the microphone's name and how loud you are
  const info = $("mic-info"), bar = $("test-bar"); $("test-meter").hidden = false;
  let stream;
  try { stream = await openAudio(SET.mic); } catch (e) { info.textContent = "마이크를 쓸 수 없어요. 브라우저 주소창의 마이크 허용을 확인하세요."; return; }
  const ctx = new (window.AudioContext || window.webkitAudioContext)(), analyser = ctx.createAnalyser();
  analyser.fftSize = 1024; ctx.createMediaStreamSource(stream).connect(analyser);
  const buf = new Float32Array(analyser.fftSize), label = (stream.getAudioTracks()[0] || {}).label || "알 수 없음", t0 = performance.now();
  let peak = 0;
  await new Promise((resolve) => (function tick() {
    analyser.getFloatTimeDomainData(buf);
    let sum = 0; for (const v of buf) sum += v * v;
    const rms = Math.sqrt(sum / buf.length); peak = Math.max(peak, rms);
    bar.style.width = Math.max(0, Math.min(100, ((20 * Math.log10(Math.max(rms, 1e-5)) + 55) / 55) * 100)) + "%";
    info.textContent = `마이크: ${label} · 지금 말해 보세요 (${Math.max(0, Math.ceil(5 - (performance.now() - t0) / 1000))}초)`;
    if (performance.now() - t0 < 5000 && $("settings").open) requestAnimationFrame(tick); else resolve();
  })());
  stream.getTracks().forEach((t) => t.stop()); ctx.close();
  const virtual = VIRTUAL_MIC.test(label) ? " (가상 마이크라 소리가 안 들어올 수 있어요. 목록에서 MacBook 마이크를 고르세요)" : "";
  info.textContent = `마이크: ${label}${virtual} · 가장 큰 소리 ${peak.toFixed(3)} — ` + (peak < 0.008 ? "너무 작아요. 마이크에 가까이 말하거나, 시스템 설정 > 소리 > 입력에서 입력 음량을 올려 보세요." : peak < 0.02 ? "조금 작아요. 더 가까이서 말해 보세요." : "좋아요.");
  renderMics();
}
$("open-settings").onclick = () => { renderSettings(); renderMics(); $("test-meter").hidden = true; $("mic-info").textContent = ""; $("settings").showModal(); };
$("set-mic").onchange = (e) => { SET.mic = e.target.value || null; saveSettings(); };
$("mic-test").onclick = micTest;
$("close-settings").onclick = () => $("settings").close();
$("vo-all").onclick = () => { SET.voices = allVoices(); saveSettings(); renderSettings(); };
$("vo-ref").onclick = () => { SET.voices = [SET.ref]; saveSettings(); renderSettings(); };
$("ref").onchange = (e) => { SET.ref = e.target.value; saveSettings(); };
$("set-slow").onchange = (e) => { SET.slow = e.target.checked; saveSettings(); };
$("set-engine").onchange = (e) => { SET.engine = e.target.value; saveSettings(); };

api("/api/pairs").then((d) => { DATA = d; fixSettings(); go(new URLSearchParams(location.search).get("tab") || "listen"); refreshDue(); })
  .catch(() => { view.innerHTML = '<p class="err">yourAccent 프로그램에 연결하지 못했습니다. 프로그램이 켜져 있는지 확인하세요.</p>'; });
